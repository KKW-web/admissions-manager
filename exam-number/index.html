<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://susi-number-lookup-2027.bboykw.chatgpt.site">
<title>2027 수시 수험번호 검색기</title>
<style>
:root{--ink:#142d31;--muted:#466269;--line:#c5d2d2;--green:#075c52;--pale:#e9f4f0;--navy:#103e43}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f2f5f4;color:var(--ink);font:16px/1.55 system-ui,"Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:1540px;margin:auto;padding:clamp(14px,2.6vw,40px)}header{border-radius:18px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:24px clamp(18px,3vw,40px)}
header small{color:#c6e9dd;font-weight:650}h1,h2,p{margin:0}h1{font-size:clamp(25px,3.3vw,38px);letter-spacing:-.06em}h2{font-size:22px;letter-spacing:-.05em}
button,input,select,summary{font:inherit}button,input,select{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:white;color:var(--ink)}button,summary,select{cursor:pointer}button:hover:not(:disabled),select:hover{border-color:var(--green)}button:disabled{color:#68797a;background:#f1f4f3;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #267bbb;outline-offset:2px}
label{display:grid;gap:4px;font-weight:650;font-size:14px}header label{color:white}#signin{display:flex;gap:8px;align-items:end}#pin{width:min(170px,48vw)}#enter{background:#c4edac;color:#173d32;border-color:transparent;font-weight:750}#lock{background:transparent;color:white;border-color:#7ca49f}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}#primary[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}#primary{font-weight:700}nav label{display:flex;align-items:center;gap:7px;color:var(--muted)}
section{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.controls{padding:clamp(15px,2vw,26px);display:grid;gap:15px}.description{color:var(--muted);font-size:14px}.bar{display:flex;gap:12px;align-items:end}.bar label{flex:1}#q{width:100%;font-size:17px;border:1.5px solid #608882;min-height:46px}.bar button{min-height:46px}details summary{font-weight:650;color:var(--green);width:fit-content}#selects{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}select{width:100%;min-width:0}
.results{display:flex;align-items:center;gap:8px 16px;justify-content:space-between;flex-wrap:wrap;padding:10px clamp(15px,2vw,26px);background:#edf3f1;border-block:1px solid var(--line)}#count{font-weight:750}#hint{font-size:13px;color:var(--muted)}#wrap{overflow:auto;max-height:60vh;max-height:60dvh}table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-size:15px}td,th{padding:8px 12px;border-bottom:1px solid #d9e2df;text-align:left}th{background:#dce9e6;color:#234b48;position:sticky;top:0;z-index:2;font-size:14px}tr:nth-child(even) td{background:#f6f9f8}tr:hover td{background:#edf6ee}td.identity{background:#f3f8f5}td button{min-height:34px;font-weight:650;font-variant-numeric:tabular-nums;color:#114e44;border-color:#b2c8bf;padding:4px 10px}td button[data-copied]{background:#d6efd8;outline:2px solid #4a8064}#empty{padding:32px 16px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:12px 18px}#status:not(:empty){margin:10px 0;padding:8px 12px;background:#fff6dd;border-radius:6px}#toast:not(:empty){position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:4;background:#153c38;color:white;border-radius:8px;padding:9px 18px;box-shadow:0 4px 15px #0002;pointer-events:none}
@media(max-width:640px){main{padding:10px}header{padding:17px;gap:12px}.controls{gap:10px}.bar{gap:6px}#q{font-size:16px}td,th{padding:7px 8px}td button{min-height:40px;padding:4px 6px}nav{gap:7px}nav label{font-size:13px}nav select{width:auto}footer{justify-content:center}#wrap{max-height:55dvh}}

#app{margin-top:18px}.bar label{font-size:17px}.bar input{margin-top:2px}td small{display:block;font-size:11px;color:#48605e;margin-top:3px}td[data-label="대학"]{font-weight:650}#wrap td[data-label="학과"],#wrap td[data-label="전형"]{white-space:normal;min-width:8em;max-width:24em}#wrap td[data-label="수험번호"] button,#wrap td[data-label="생년월일"] button{font-family:ui-monospace,monospace}
@media(max-width:720px){
 #app{margin-top:10px}#wrap{max-height:none;overflow:visible}table,tbody{display:block}thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}tbody{padding:0 12px}tbody tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
 #wrap td,#wrap tr:hover td,#wrap tr:nth-child(even) td{display:block;border:0;padding:0;min-width:0;max-width:none;background:white;white-space:normal;overflow-wrap:anywhere}
 td:before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);font-weight:600}td[data-label="이름"]{grid-column:1/-1;display:flex!important;align-items:center;gap:8px}td[data-label="이름"]:before{display:none}td small{margin:0}#wrap td[data-label="학과"],#wrap td[data-label="전형"]{min-width:0}td button{max-width:100%;min-height:38px}#signin{max-width:100%}.bar label{min-width:0}
}
</style></head><body><main>
<header><div><small>2027학년도 수시모집 · 10월 22일 수정본</small><h1>수험번호 검색기</h1></div>
<form id="signin"><label>교사용 접속 비밀번호<input type="password" id="pin" inputmode="numeric" autocomplete="current-password" required></label><button id="enter">로그인</button></form><button id="lock" hidden>로그아웃</button></header>
<p id="status" role="status"></p><div id="app" hidden>
<section><div class="controls">
<div class="bar"><label>학생별 지원 검색<input id="q" type="search" autocomplete="off" placeholder="이름 또는 대학명 · 여러 대학은 쉼표로 구분"></label><button id="reset">초기화</button></div>
<details id="more"><summary id="filterTitle">상세 조건</summary><div id="selects"></div></details></div>
<div class="results"><p id="count" aria-live="polite"></p><span id="hint"></span></div>
<div id="wrap" tabindex="0" role="region" aria-label="검색 결과 표"><table><thead></thead><tbody></tbody></table><p id="empty" hidden></p></div>
<footer id="pager" hidden><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></footer></section></div><div id="toast" role="status"></div></main>
<script>
'use strict';
const base=location.origin==='https://kkw-web.github.io'?'https://susi-number-lookup-2027.bboykw.chatgpt.site':location.origin;
const $=id=>document.getElementById(id);
function elem(tag,text=''){const el=document.createElement(tag);el.textContent=text;return el}
const identity=['성명','수험번호','생년월일'];
let token='',page=0,version=0,debounce,expiry,toastTimer,needsOptions=true;
function clearResults(){
 $('pager').hidden=true;document.querySelector('thead').replaceChildren();document.querySelector('tbody').replaceChildren();
 $('empty').hidden=true;$('prev').disabled=$('next').disabled=true;$('page').textContent='';$('count').textContent='';
}
function lock(message=''){
 token='';version++;clearTimeout(debounce);clearTimeout(expiry);clearTimeout(toastTimer);
 $('app').hidden=true;$('signin').hidden=false;$('lock').hidden=true;$('pin').value='';$('q').value='';
 $('selects').replaceChildren();clearResults();$('toast').textContent='';$('status').textContent=message;$('pin').focus();
}
async function request(path,data){
 const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;
 let res;try{res=await fetch(base+path,{method:'POST',headers,body:JSON.stringify(data),credentials:'omit',cache:'no-store'})}
 catch{throw Error('서버에 연결하지 못했습니다. 연결 상태를 확인한 뒤 다시 시도해 주세요.')}
 const result=await res.json().catch(()=>({}));
 if(!res.ok)throw Object.assign(Error(result.error||'요청을 처리하지 못했습니다.'),{status:res.status});return result;
}
$('signin').onsubmit=async e=>{e.preventDefault();$('enter').disabled=true;$('status').textContent='로그인 중…';
 try{const r=await request('/login',{password:$('pin').value});token=r.token;$('pin').value='';$('signin').hidden=true;$('lock').hidden=false;$('app').hidden=false;
 expiry=setTimeout(()=>lock('조회 시간이 끝났습니다. 다시 로그인해 주세요.'),1800000);resetSearch();$('q').focus();}
 catch(e){$('status').textContent=e.message;$('pin').select()}finally{$('enter').disabled=false}};
$('lock').onclick=()=>lock('로그아웃했습니다.');
function resetSearch(){
 page=0;needsOptions=true;clearTimeout(debounce);$('q').value='';
 $('selects').replaceChildren();$('more').open=false;$('filterTitle').textContent='상세 조건';$('hint').textContent='';clearResults();load();
}
function buildFilters(options,filters){
 const previous=document.activeElement;
 const oldControls=new Map([...$('selects').querySelectorAll('select')].map(s=>[s.name,s]));
 for(const [key,values] of Object.entries(options)){
   let select=oldControls.get(key);
   if(!select){
     const label=elem('label',key);select=elem('select');select.name=key;label.append(select);$('selects').append(label);
     select.onchange=()=>{
       if(key==='대학'||key==='전형'){
         for(const other of $('selects').querySelectorAll('select')){
           if(other.name==='학과'||(key==='대학'&&other.name==='전형'))other.value='';
         }
       }
       page=0;needsOptions=true;clearTimeout(debounce);load();
     };
   }
   select.replaceChildren(new Option('전체',''));
   for(const val of values)select.add(new Option(val,val));
   select.value=filters[key]||'';
 }
 if(previous&&oldControls.get(previous.name)===previous)previous.focus();
}
function copyButton(col,val){
 const label=col==='성명'?'이름':col,b=elem('button',val);b.type='button';b.title=label+' 복사';b.setAttribute('aria-label',label+' '+val+' 복사');
 b.onclick=async()=>{try{await navigator.clipboard.writeText(val);b.dataset.copied='';setTimeout(()=>delete b.dataset.copied,1000);
 $('toast').textContent=label+' 복사 완료';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',1800)}catch{prompt(label+' 값을 선택해 복사해 주세요.',val)}};return b;
}
function render(r){
 const cols=[...identity,'대학','학과','전형','내신'];
 const head=elem('tr');for(const k of cols){const th=elem('th',k==='성명'?'이름':k);th.scope='col';head.append(th)}document.querySelector('thead').replaceChildren(head);
 const body=document.createDocumentFragment();
 for(const row of r.rows){const tr=elem('tr');for(const col of cols){const v=row[col],td=elem('td',v||'—');td.dataset.label=col==='성명'?'이름':col;
 if(v&&identity.includes(col)){td.className='identity';td.replaceChildren(copyButton(col,v))}if(col==='성명'){
   const context=[row['재학여부'],row['자료학년도']&&row['재학여부']==='졸업생'?row['자료학년도']+'학년도':'',row['반']?row['반']+'반':'',row['번호']?row['번호']+'번':''].filter(Boolean);
   td.append(elem('small',context.join(' · ')));
 }tr.append(td)}body.append(tr)}
 document.querySelector('tbody').replaceChildren(body);page=r.page;
 $('hint').textContent=r.rows.length&&cols.some(k=>identity.includes(k))?'테두리가 있는 값을 누르면 복사됩니다.':'';
 $('count').textContent=r.count===r.total?'전체 '+r.total.toLocaleString()+'건':'검색 결과 '+r.count.toLocaleString()+'건 / 전체 '+r.total.toLocaleString()+'건';$('pager').hidden=r.count<=50;
 $('empty').hidden=!!r.count;$('empty').textContent=r.total?'일치하는 자료가 없습니다. 검색어나 상세 조건을 확인해 주세요.':'원본에 등록된 항목이 없습니다.';
 $('page').textContent=r.count?(page+1)+' / '+Math.ceil(r.count/50)+'쪽':'';$('prev').disabled=!page;$('next').disabled=(page+1)*50>=r.count;$('wrap').scrollTop=0;
}
async function load(){
 const id=++version,filters=Object.fromEntries([...$('selects').querySelectorAll('select')].map(s=>[s.name,s.value]).filter(([,v])=>v));
 const active=Object.entries(filters).map(([k,v])=>k+' '+v);$('filterTitle').textContent=active.length?'상세 조건 · '+active.join(' / '):'상세 조건';
 clearResults();$('hint').textContent='';$('status').textContent='조회 중…';$('prev').disabled=$('next').disabled=true;
 try{const r=await request('/search',{tab:'지원내역',query:$('q').value,filters,page,options:needsOptions});if(id!==version||!token)return;
 if(r.options){buildFilters(r.options,filters);needsOptions=false}render(r);$('status').textContent='';}
 catch(e){if(id!==version)return;if(e.status===401){lock(e.message);return}clearResults();$('hint').textContent='';$('status').textContent=e.message;}
}
$('q').oninput=()=>{version++;page=0;clearTimeout(debounce);clearResults();$('hint').textContent='';debounce=setTimeout(load,180)};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){clearTimeout(debounce);page=0;load()}};
$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('reset').onclick=()=>{resetSearch();$('q').focus()};
</script></body></html>

name: Validate source without student data
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject private records in tracked source
        run: python3 check_source.py
      - name: Test roles and data preservation with synthetic records
        run: python3 -m unittest test_regressions -v
      - name: Check browser code
        run: node --check static/app.js

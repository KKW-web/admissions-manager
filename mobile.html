        month: '2-digit',
        day: '2-digit',
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return `${values.year}-${values.month}-${values.day}`;
    }

    function contextualTextSuggestionIndex(key) {
      const globalIndex = state.textSuggestionIndexes[key] || [];
      if (key !== 'admissionName' && key !== 'recruitmentUnit') return globalIndex;
      const typedUniversity = elements.universityInput.value.trim();
      if (!typedUniversity || !state.universityContextIndexes.length) return globalIndex;

      const canonical = canonicalUniversityName(typedUniversity, state.universities);
      const normalized = normalizeUniversityTerm(canonical);
      const exact = state.universityContextByNormalized.get(normalized);
      let contexts = exact ? [exact] : [];
      const family = exact ? exact.family : universityFamilyKey(canonical);
      const familyContexts = state.universityContextsByFamily.get(family) || [];
      if (exact && elements.includeCampusesToggle.checked && !universityIsCampus(exact.university)) {
        contexts = familyContexts.length ? familyContexts : contexts;
      } else if (!exact && !universityIsCampus(canonical)) {
        if (elements.includeCampusesToggle.checked) {
          contexts = familyContexts;
        } else {
          const primaryAlias = primaryCampusAliasForFamily(family);
          const primary = familyContexts.find(context => !universityIsCampus(context.university)) ||
            familyContexts.find(context => universityCampusAlias(context.university) === primaryAlias);
          if (primary) contexts = [primary];
        }
      }
      if (!contexts.length) return globalIndex;
      const seen = new Set();
      const combined = [];
      contexts.forEach(context => {
        (context[key] || []).forEach(item => {
          if (seen.has(item.normalized)) return;
          seen.add(item.normalized);
          combined.push(item);
        });
      });
      return combined;
    }

    function localTextSuggestions(key, query, limit = 12) {
      const normalizedQuery = normalizeUniversityTerm(query);
      if (!normalizedQuery) return [];
      const contextUniversity = key === 'admissionName' || key === 'recruitmentUnit'
        ? normalizeUniversityTerm(elements.universityInput.value.trim())
        : '';
      const contextCampuses = contextUniversity && elements.includeCampusesToggle.checked ? '1' : '0';
      const cacheKey = `${key}\u0000${contextUniversity}\u0000${contextCampuses}\u0000${normalizedQuery}\u0000${limit}`;
      const cached = state.textSuggestionCache.get(cacheKey);
      if (cached) return [...cached];
      let exact = '';
      const prefixes = [];
      const contains = [];
      for (const item of contextualTextSuggestionIndex(key)) {
        if (item.normalized === normalizedQuery) exact = item.value;
        else if (item.normalized.startsWith(normalizedQuery) && prefixes.length < limit) prefixes.push(item.value);
        else if (item.normalized.includes(normalizedQuery) && contains.length < limit) contains.push(item.value);
      }
      const result = [exact, ...prefixes, ...contains].filter(Boolean).slice(0, limit);
      state.textSuggestionCache.set(cacheKey, result);
      while (state.textSuggestionCache.size > 64) {
        state.textSuggestionCache.delete(state.textSuggestionCache.keys().next().value);
      }
      return [...result];
    }

    async function textSuggestions(key, query) {
      if (!(state.textSuggestionIndexes[key] || []).length && state.metaPromise) {
        try { await state.metaPromise; } catch (_) { /* 빈 후보로 계속합니다. */ }
      }
      if ((key === 'admissionName' || key === 'recruitmentUnit') && state.universityContextPromise) {
        try { await state.universityContextPromise; } catch (_) { /* 전역 후보로 계속합니다. */ }
      }
      return localTextSuggestions(key, query);
    }

    function setUniversityOptions(values) {
      const unique = [...new Set((Array.isArray(values) ? values : [])
        .map(value => String(value || '').trim())
        .filter(Boolean))];
      state.universities = unique;
      state.universitySearchIndex = unique.map(name => ({ name, normalized: normalizeUniversityTerm(name) }));
      state.universitySuggestionCache.clear();
    }

    function localUniversitySuggestions(query, limit = 12) {
      const normalizedQuery = normalizeUniversityTerm(query);
      if (!normalizedQuery) return [];
      const queryFamily = universityFamilyKey(query);
      const primaryAlias = primaryCampusAliasForFamily(queryFamily);
      return state.universitySearchIndex
        .filter(item => item.normalized.includes(normalizedQuery))
        .sort((left, right) => {
          const leftExact = left.normalized === normalizedQuery ? 0 : (left.normalized.startsWith(normalizedQuery) ? 1 : 2);
          const rightExact = right.normalized === normalizedQuery ? 0 : (right.normalized.startsWith(normalizedQuery) ? 1 : 2);
          const leftCampus = !universityIsCampus(left.name) ? 0
            : (universityFamilyKey(left.name) === queryFamily && universityCampusAlias(left.name) === primaryAlias ? 1 : 2);
          const rightCampus = !universityIsCampus(right.name) ? 0
            : (universityFamilyKey(right.name) === queryFamily && universityCampusAlias(right.name) === primaryAlias ? 1 : 2);
          return leftExact - rightExact || leftCampus - rightCampus || left.name.localeCompare(right.name, 'ko');
        })
        .slice(0, limit)
        .map(item => item.name);
    }

    function canonicalUniversityFromFamily(raw, matches) {
      if (!matches.length) return '';
      const requestedCampus = universityCampusAlias(raw);
      if (requestedCampus) {
        const campusMatches = matches.filter(
          item => universityCampusAlias(item.name) === requestedCampus
        );
        return campusMatches.length === 1 ? campusMatches[0].name : '';
      }
      const mainMatches = matches.filter(item => !universityIsCampus(item.name));
      if (mainMatches.length === 1) return mainMatches[0].name;
      return matches.length === 1 ? matches[0].name : '';
    }

    function canonicalUniversityName(query, candidates) {
      const raw = String(query || '').trim();
      const normalized = normalizeUniversityTerm(raw);
      if (!normalized) return '';
      const indexed = candidates === state.universities && state.universitySearchIndex.length
        ? state.universitySearchIndex
        : (Array.isArray(candidates) ? candidates : [])
          .map(name => ({ name: String(name || '').trim(), normalized: normalizeUniversityTerm(name) }))
          .filter(item => item.name);
      const exact = indexed.find(item => item.normalized === normalized);
      if (exact) return exact.name;

      const campusMatch = normalized.match(/^(.*?)(\([^)]*\))$/);
      const base = campusMatch ? campusMatch[1] : normalized;
      const campusSuffix = campusMatch ? campusMatch[2] : '';
      const aliases = new Set([normalized]);
      if (base.endsWith('대')) aliases.add(`${base.slice(0, -1)}대학교${campusSuffix}`);
      else if (!base.endsWith('대학교')) aliases.add(`${base}대학교${campusSuffix}`);
      const aliasMatches = indexed.filter(item => aliases.has(item.normalized));
      if (aliasMatches.length === 1) return aliasMatches[0].name;

      // 정식 명칭에만 "국립"이 붙는 대학은 사용자가 흔히 쓰는 약칭도
      // 고유하게 대응합니다. 캠퍼스가 여럿이면 입력한 캠퍼스를 우선하고,
      // 캠퍼스 미지정 검색은 본교 표기 한 건만 자동 선택합니다.
      const requestedFamily = universityFamilyKey(raw);
      const familyMatches = indexed.filter(item => universityFamilyKey(item.name) === requestedFamily);
      const directFamily = canonicalUniversityFromFamily(raw, familyMatches);
      if (directFamily) return directFamily;

      // 자동완성에 공식 교명이 한 대학군만 남는 고유 앞부분은 검색 버튼이나
      // Enter를 누를 때 그 공식명으로 확정합니다. 예: "울산과학" →
      // "울산과학기술원". 서로 다른 대학군이 함께 걸리면 정확성을 위해
      // 어떤 후보도 임의 선택하지 않고 사용자가 목록에서 직접 고르게 합니다.
      if ([...normalized].length >= 2) {
        const prefixFamilies = new Map();
        indexed.forEach(item => {
          if (!item.normalized.startsWith(normalized)) return;
          const family = universityFamilyKey(item.name);
          if (!prefixFamilies.has(family)) prefixFamilies.set(family, []);
          prefixFamilies.get(family).push(item);
        });
        if (prefixFamilies.size === 1) {
          const prefixMatches = prefixFamilies.values().next().value;
          const canonical = canonicalUniversityFromFamily(raw, prefixMatches);
          if (canonical) return canonical;
        }
      }

      // 자동완성과 같은 후보군 안에서 접미 약칭이 유일한 대학군일 때만
      // 정식 교명으로 바꿉니다. 여러 대학이 겹치면 입력값을 그대로 두어
      // 사용자가 목록에서 직접 선택하도록 합니다.
      if ([...requestedFamily].length >= 2) {
        const suffixFamilies = new Map();
        indexed.forEach(item => {
          const family = universityFamilyKey(item.name);
          if (!family.endsWith(requestedFamily)) return;
          if (!suffixFamilies.has(family)) suffixFamilies.set(family, []);
          suffixFamilies.get(family).push(item);
        });
        if (suffixFamilies.size === 1) {
          const suffixMatches = suffixFamilies.values().next().value;
          const canonical = canonicalUniversityFromFamily(raw, suffixMatches);
          if (canonical) return canonical;
        }
      }
      return raw;
    }

    async function universitySuggestions(query) {
      const rawQuery = String(query || '').trim();
      const normalizedQuery = normalizeUniversityTerm(query);
      if ([...normalizedQuery].length < 2) return [];
      if (state.universitySearchIndex.length) return localUniversitySuggestions(query);
      // A fully typed university name is already usable as an exact search key.
      // Do not start a large metadata request just to echo the same text.
      if (/대학교(?:\([^)]*\))?$/.test(normalizedQuery)) return [rawQuery];
      if (state.metaPromise) {
        // 동일한 cold rows cache를 두 실행이 동시에 만들지 않게 현재 인덱스
        // 초기화를 공유합니다. 로그인 직후 시작 지연 자체는 짧게 유지합니다.
        try { await state.metaPromise; } catch (_) { /* Fall through to the focused endpoint. */ }
        if (state.universitySearchIndex.length) return localUniversitySuggestions(query);
      }

      const cached = state.universitySuggestionCache.get(normalizedQuery);
      if (cached) return [...cached];
      const pending = state.universitySuggestionRequests.get(normalizedQuery);
      if (pending) return pending;

      const request = api('universities', { query: String(query || '').trim() })
        .then(data => {
          const names = [...new Set((Array.isArray(data.suggestions) ? data.suggestions : [])
            .map(value => String(value || '').trim())
            .filter(Boolean))].slice(0, 12);
          state.universitySuggestionCache.set(normalizedQuery, names);
          while (state.universitySuggestionCache.size > 24) {
            state.universitySuggestionCache.delete(state.universitySuggestionCache.keys().next().value);
          }
          return [...names];
        })
        .finally(() => state.universitySuggestionRequests.delete(normalizedQuery));
      state.universitySuggestionRequests.set(normalizedQuery, request);
      return request;
    }

    function abortError() {
      const error = new Error('검색 요청이 취소되었습니다.');
      error.name = 'AbortError';
      return error;
    }

    async function canonicalizeUniversityInputs(signal) {
      const input = elements.universityInput;
      const typedValue = input.value.trim();
      if (!typedValue) return;
      if (signal && signal.aborted) throw abortError();
      const candidates = state.universities;
      let canonical = canonicalUniversityName(typedValue, candidates);
      if (!candidates.length && canonical === typedValue) {
        const campusMatch = typedValue.match(/^(.*?)(\s*[（(][^）)]*[）)])$/);
        const base = (campusMatch ? campusMatch[1] : typedValue).trim();
        const campusSuffix = campusMatch ? campusMatch[2] : '';
        if ([...base].length >= 3 && base.endsWith('대') && !base.endsWith('대학교')) {
          canonical = `${base.slice(0, -1)}대학교${campusSuffix}`;
        }
      }
      if ((signal && signal.aborted) || input.value.trim() !== typedValue) return;
      if (canonical) input.value = canonical;
    }

    function cloneSearchResponse(data) {
      const records = Array.isArray(data && data.records) ? data.records : [];
      return {
        records: records.map(record => ({ ...record })),
        totalMatches: Number(data && data.totalMatches) || 0,
        truncated: Boolean(data && data.truncated),
        revision: String(data && data.revision != null ? data.revision : ''),
        sourceRevision: String(data && data.sourceRevision != null ? data.sourceRevision : ''),
        serverTime: data && data.serverTime,
      };
    }

    function rememberSearchResponse(filters, data) {
      const snapshot = cloneSearchResponse(data);
      // An empty result is still an exact, revision-scoped answer. Caching it
      // avoids a full search when the same zero-result query is repeated; the
      // conditional sync below always validates its revision before reuse.
      if (!snapshot.revision) return;
      snapshot.cachedAt = Date.now();
      const key = searchCacheKey(filters);
      state.searchCache.delete(key);
      state.searchCache.set(key, snapshot);
      while (state.searchCache.size > SEARCH_CACHE_LIMIT) {
        state.searchCache.delete(state.searchCache.keys().next().value);
      }
    }

    function cachedSearchResponse(filters) {
      const key = searchCacheKey(filters);
      const cached = state.searchCache.get(key);
      if (!cached || !cached.revision || cached.revision !== String(state.dataRevision || '')
        || Date.now() - Number(cached.cachedAt || 0) > SEARCH_CACHE_TTL_MS) {
        state.searchCache.delete(key);
        return null;
      }
      state.searchCache.delete(key);
      state.searchCache.set(key, cached);
      return cloneSearchResponse(cached);
    }

    function applySearchResponse(data, filters, { silent = false, verified = true } = {}) {
      const nextRecords = Array.isArray(data.records) ? data.records : [];
      const nextSignature = makeRecordsSignature(nextRecords, data.totalMatches, data.truncated);
      const unchanged = silent && nextSignature === state.recordsSignature;
      state.dataRevision = String(data.revision == null ? state.dataRevision : data.revision);
      scheduleMetaRefresh(data.sourceRevision || data.revision);
      if (verified) state.lastFullSyncAt = Date.now();
      if (unchanged) return false;

      state.records = nextRecords;
      adoptRecoveredDrafts(nextRecords);
      state.recordsSignature = nextSignature;
      state.lastTotalMatches = Number(data.totalMatches) || 0;
      state.lastTruncated = Boolean(data.truncated);
      state.lastFilters = { ...filters };
      if (!silent) {
        state.visibleCount = INITIAL_PAGE_SIZE;
        state.sortKey = DEFAULT_SORT_KEY;
        state.sortDirection = DEFAULT_SORT_DIRECTION;
        syncSortControls();
      } else {
        state.visibleCount = Math.max(INITIAL_PAGE_SIZE, state.visibleCount);
      }
      updateMobileSearchSummary(filters);
      setSearchLayout(true, { collapseMobile: !silent });
      renderResults(data.totalMatches, data.truncated);
      return true;
    }

    async function performSearch({ silent = false, manual = !silent } = {}) {
      if (manual && state.pollController) state.pollController.abort();
      if (state.searching) {
        if (manual && state.searchController) {
          state.pendingManualSearch = true;
          setSearchBusy(true);
          state.searchController.abort();
        }
        return;
      }
      if (hasActiveInlineWork()) {
        if (!silent) toast('입력값 저장이 끝난 뒤 다시 검색해 주세요.', 'error');
        return;
      }
      const initialFilters = silent && state.lastFilters ? state.lastFilters : collectFilters();

      const controller = new AbortController();
      state.searching = true;
      state.searchingSilent = silent;
      state.searchingManual = manual;
      state.searchController = controller;
      setSyncState('busy', silent ? '동기화 중' : '검색 중');
      if (manual) setSearchBusy(true);
      try {
        if (!silent) await canonicalizeUniversityInputs(controller.signal);
        if (controller.signal.aborted) return;
        const filters = silent && state.lastFilters ? state.lastFilters : collectFilters();
        const cached = manual ? cachedSearchResponse(filters) : null;
        if (cached) {
          applySearchResponse(cached, filters, { silent: false, verified: false });
          setSearchBusy(false);
          setSyncState('busy', '최신 확인 중');
        }

        let data = null;
        if (cached) {
          // Validate and, only when changed, fetch the new rows in one Apps
          // Script execution. This preserves revision accuracy while removing
          // the former revision -> search double round trip.
          const validation = await api('sync', {
            filters,
            knownRevision: cached.revision,
            force: false,
          }, { signal: controller.signal });
          if (controller.signal.aborted) return;
          if (validation.notModified) {
            state.dataRevision = String(validation.revision == null ? cached.revision : validation.revision);
            scheduleMetaRefresh(validation.sourceRevision || validation.revision);
            state.lastFullSyncAt = Date.now();
            setSyncState('online', timeLabel(validation.serverTime));
            schedulePolling();
            return;
          }
          data = validation;
        }

        if (!data) data = await api('search', { filters }, { signal: controller.signal });
        if (controller.signal.aborted) return;
        if (silent && hasActiveInlineWork()) {
          setSyncState('online', timeLabel(data.serverTime));
          return;
        }
        rememberSearchResponse(filters, data);
        applySearchResponse(data, filters, { silent });
        setSyncState('online', timeLabel(data.serverTime));
        schedulePolling();
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        setSyncState('error', '연결 오류');
        if (!silent && error.code !== 'CONFIG_REQUIRED') toast(error.message, 'error');
      } finally {
        const rerunManualSearch = state.pendingManualSearch;
        state.searching = false;
        state.searchingSilent = false;
        state.searchingManual = false;
        state.searchController = null;
        if (manual && !rerunManualSearch) setSearchBusy(false);
        if (rerunManualSearch) {
          state.pendingManualSearch = false;
          queueMicrotask(() => performSearch({ silent: false, manual: true }));
        }
      }
    }

    function makeRecordsSignature(records, totalMatches, truncated) {
      return `${Number(totalMatches) || 0}:${truncated ? 1 : 0}:` + records
        .map(record => `${record.id || ''}.${record.version || ''}`)
        .join('|');
    }

    function setSearchBusy(busy) {
      [elements.desktopSearchButton, elements.mobileSearchButton].forEach(button => {
        button.disabled = busy;
        button.setAttribute('aria-busy', String(busy));
        const label = button.querySelector('span');
        if (label) label.textContent = busy ? '로딩 중' : '검색';
      });
      elements.searchForm.setAttribute('aria-busy', String(busy));
      elements.loadingOverlay.hidden = !busy;
      if (busy && !state.records.length && !elements.resultsSection.hidden) {
        elements.resultsCount.textContent = '검색 중';
        elements.emptyState.querySelector('span').textContent = '검색 중';
      } else if (!busy && !state.records.length && state.lastFilters) {
        renderResults();
      }
    }

    function schedulePolling() {
      clearInterval(state.pollingTimer);
      if (!state.lastFilters) return;
      state.pollingTimer = setInterval(() => {
        if (!document.hidden && !hasActiveUserInput()) pollForChanges();
      }, REVISION_POLL_INTERVAL_MS);
    }

    async function pollForChanges() {
      if (state.pollingBusy || state.searching || !state.lastFilters || hasActiveUserInput()) return;
      const controller = new AbortController();
      state.pollingBusy = true;
      state.pollController = controller;
      try {
        const fallbackDue = Date.now() - state.lastFullSyncAt >= FULL_SYNC_INTERVAL_MS;
        const filters = { ...state.lastFilters };
        const data = await api('sync', {
          filters,
          knownRevision: state.dataRevision,
          force: fallbackDue || !state.dataRevision,
        }, { signal: controller.signal });
        if (controller.signal.aborted) return;
        if (data.notModified) {
          state.dataRevision = String(data.revision == null ? state.dataRevision : data.revision);
          scheduleMetaRefresh(data.sourceRevision || data.revision);
          setSyncState('online', timeLabel(data.serverTime));
          return;
        }
        if (hasActiveInlineWork()) {
          setSyncState('online', timeLabel(data.serverTime));
          return;
        }
        rememberSearchResponse(filters, data);
        applySearchResponse(data, filters, { silent: true });
        setSyncState('online', timeLabel(data.serverTime));
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        if (error.code !== 'AUTH_REQUIRED' && error.code !== 'SESSION_EXPIRED') {
          setSyncState('error', '연결 오류');
        }
      } finally {
        if (state.pollController === controller) state.pollController = null;
        state.pollingBusy = false;
      }
    }

    function hasActiveInlineWork() {
      return state.drafts.size > 0 || state.inFlightDrafts.size > 0
        || state.conflictedDrafts.size > 0 || state.saving.size > 0;
    }

    function hasActiveUserInput() {
      return hasActiveInlineWork();
    }

    function renderResults(
      totalMatches = state.lastTotalMatches || state.records.length,
      truncated = state.lastTruncated
    ) {
      const sorted = sortedRecords();
      const visible = sorted.slice(0, state.visibleCount);
      const shownCount = Math.min(state.visibleCount, sorted.length);
      elements.resultsCount.replaceChildren(
        document.createTextNode('검색 결과 '),
        makeElement('strong', String(totalMatches)),
        truncated ? document.createTextNode(' · 일부 표시') : document.createTextNode('')
      );

      let summary=document.getElementById('integrationSummary');
      if(!summary){summary=document.createElement('p');summary.id='integrationSummary';summary.setAttribute('aria-live','polite');elements.resultsCount.parentElement.append(summary);}
      const count=rows=>new Set(rows.map(row=>row.studentKey ?? row.id)).size;
      const pass=value=>['합격','충원합격'].includes(value);
      summary.textContent='지원 '+count(sorted)+'명 · 1차 합격 '+count(sorted.filter(row=>!row.stage1Locked && pass(row.stage1)))+'명 · 최종 합격 '+count(sorted.filter(row=>pass(row.finalResult)))+'명';
      const hasRecords = sorted.length > 0;
      elements.resultsSection.hidden = !state.lastFilters && !hasRecords;
      elements.emptyState.hidden = hasRecords;
      elements.exportButton.hidden = EDITION !== 'pc';
      elements.exportButton.disabled = state.exporting || hasActiveInlineWork() || !state.lastFilters || !hasRecords;
      if (!hasRecords) {
        elements.emptyState.querySelector('span').textContent = '검색 결과 없음';
      }

      if (EDITION === 'pc') renderTable(visible);
      else renderCards(visible);

      const canMore = shownCount < sorted.length;
      const canCollapse = shownCount > INITIAL_PAGE_SIZE;
      elements.listControls.hidden = !hasRecords || (!canMore && !canCollapse);
      elements.moreButton.hidden = !canMore;
      elements.expandAllButton.hidden = !canMore;
      elements.collapseButton.hidden = !canCollapse;
      elements.moreButton.setAttribute('aria-expanded', String(canMore));
      elements.expandAllButton.setAttribute('aria-expanded', String(!canMore));
    }

    function sortedRecords() {
      return [...state.records].sort((a, b) => {
        const av = String(a[state.sortKey] || '');
        const bv = String(b[state.sortKey] || '');
        const numeric = ['classNo', 'studentNo', 'birthdate'].includes(state.sortKey);
        const result = state.sortKey==='enrollment' ? ((a.enrollment==='재학생'?0:1)-(b.enrollment==='재학생'?0:1)) : numeric
          ? av.localeCompare(bv, 'ko', { numeric: true, sensitivity: 'base' })
          : av.localeCompare(bv, 'ko', { numeric: true, sensitivity: 'base' });
        return (state.sortDirection === 'asc' ? result : -result) || String(a.classNo||'').localeCompare(String(b.classNo||''),'ko',{numeric:true}) || String(a.studentNo||'').localeCompare(String(b.studentNo||''),'ko',{numeric:true}) || String(a.name||'').localeCompare(String(b.name||''),'ko') || String(a.admissionName||'').localeCompare(String(b.admissionName||''),'ko');
      });
    }

    function renderTable(records) {
      elements.tableWrap.hidden = records.length === 0;
      elements.mobileSortbar.hidden = true;
      elements.cardList.replaceChildren();
      elements.tableHead.replaceChildren();
      const headFragment = document.createDocumentFragment();
      COLUMNS.filter(column=>column.key!=='reviewReason'||state.lastFilters?.reviewOnly).forEach(column => {
        const th = makeElement('th');
        th.dataset.column=column.key;
        const active = state.sortKey === column.key;
        th.setAttribute('aria-sort', active ? (state.sortDirection === 'asc' ? 'ascending' : 'descending') : 'none');
        const button = makeElement('button', '', 'sort-button');
        button.type = 'button';
        button.dataset.sortKey = column.key;
        if (RESULT_DEFINITIONS[column.key]?.help) button.title = RESULT_DEFINITIONS[column.key].help;
        const sortIcon = makeSvgIcon(
          active
            ? '<path d="M12 19V5M7 10l5-5 5 5"/>'
            : '<path d="m8 9 4-4 4 4M16 15l-4 4-4-4"/>',
          'button-icon sort-mark-icon'
        );
        button.append(makeElement('span', column.label), sortIcon);
        button.addEventListener('click', () => changeSort(column.key));
        th.append(button);
        headFragment.append(th);
      });
      elements.tableHead.append(headFragment);

      elements.tableBody.replaceChildren();
      const bodyFragment = document.createDocumentFragment();
      records.forEach(record => {
        const tr = makeElement('tr');
        COLUMNS.filter(column=>column.key!=='reviewReason'||state.lastFilters?.reviewOnly).forEach(column => {
          if (column.result) {
            const td = makeElement('td', '', `cell-result cell-result-${column.key}`);
            td.dataset.column=column.key;
            const field = makeInlineResultField(record, column.key, false, false);
            if (field.classList.contains('is-filled')) td.classList.add('is-filled');
            if (field.classList.contains('is-locked')) td.classList.add('is-locked');
            td.append(field);
            tr.append(td);
            return;
          }
          const value = displayValue(record, column.key);
          const td = makeElement('td');
          if (column.key === 'name') td.className = 'cell-name';
          if (column.key === 'enrollment') {
            td.classList.add('cell-enrollment');
            const statusClass = enrollmentStatusClass(record.enrollment);
            if (statusClass) td.classList.add(statusClass);
          }
          if (column.key === 'birthdate') td.className = 'cell-dob';
          if (column.key === 'examNo') td.className = 'cell-exam';
          if (column.key === 'admissionName') td.className = 'cell-admission';
          if (column.key === 'recruitmentUnit') td.className = 'cell-recruitment-unit';
          if (column.key === 'university') td.className = 'cell-university';
          if(column.key==='reviewReason'){td.style.cssText='min-width:280px;max-width:380px;white-space:normal;line-height:1.6;color:#945300';}
          td.dataset.column=column.key;
          td.title = value === '-' ? '' : value;
          if (['name', 'birthdate', 'examNo'].includes(column.key)) {
            td.append(makeCopyValue(value, column.label));
          } else {
            td.textContent = value;
          }
          tr.append(td);
        });
        bodyFragment.append(tr);
      });
      elements.tableBody.append(bodyFragment);
    }

    function renderCards(records) {
      elements.tableWrap.hidden = true;
      elements.mobileSortbar.hidden = records.length === 0;
      elements.tableBody.replaceChildren();
      elements.cardList.replaceChildren();
      const fragment = document.createDocumentFragment();
      records.forEach(record => {
        const card = makeElement('article', '', 'result-card');
        const primary = makeElement('div', '', 'card-primary');
        const identity = makeElement('div', '', 'card-identity');
        const nameRow = makeElement('div', '', 'card-name-row');
        const name = makeElement('h3', record.name || '-', 'card-name');
        name.title = record.name || '';
        nameRow.append(name, makeCopyButton(record.name || '-', '성명'));
        const university = makeElement('div', record.university || '-', 'card-university');
        university.title = record.university || '';
        identity.append(nameRow, university);

        const quickMeta = makeElement('div', '', 'card-quick-meta');
        quickMeta.setAttribute('aria-label', '학생 정보');
        quickMeta.append(
          metaRow('재학여부', record.enrollment, false, enrollmentStatusClass(record.enrollment)),
          metaRow('반', record.classNo),
          metaRow('번호', record.studentNo),
          metaRow('계열', record.track)
        );
        primary.append(identity, quickMeta);

        const keys = makeElement('div', '', 'card-keydata');
        if(existingUser?.role==='admin')keys.append(keyData('생년월일', normalizeBirthdate(record.birthdate)), keyData('수험번호', record.examNo || '-'));

        const meta = makeElement('div', '', 'card-meta');
        meta.append(
          metaRow('전형유형', record.admissionType),
          metaRow('전형명', cleanAdmissionName(record.admissionName), true),
          metaRow('모집단위', record.recruitmentUnit, true)
        );

        if(state.lastFilters?.reviewOnly)meta.append(metaRow('부족한 정보 · 확인할 내용',record.reviewReason,true));
        const inlineResults = makeElement('div', '', 'card-inline-results');
        ['stage1', 'finalResult', 'firstWait'].forEach(key => {
          inlineResults.append(makeInlineResultField(record, key, true, false));
        });
        card.append(primary, keys, meta, inlineResults);
        fragment.append(card);
      });
      elements.cardList.append(fragment);
    }

    function keyData(label, value) {
      const box = makeElement('div', '', 'keydata-box');
      box.append(makeElement('small', label), makeCopyValue(value || '-', label));
      return box;
    }

    function makeCopyValue(value, label) {
      const wrap = makeElement('span', '', 'copy-value');
      const text = makeElement('span', value || '-', 'copy-text');
      text.title = value || '';
      wrap.append(text, makeCopyButton(value, label));
      return wrap;
    }

    function makeCopyButton(value, label) {
      const copyValue = label === '생년월일' ? normalizeBirthdate(value) : value;
      const button = makeElement('button', '', 'copy-button');
      button.type = 'button';
      button.setAttribute('aria-label', `${label} 복사`);
      button.title = '복사';
      button.append(makeSvgIcon('<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'));
      button.addEventListener('click', event => {
        event.stopPropagation();
        copyToClipboard(copyValue);
      });
      return button;
    }

    async function copyToClipboard(value) {
      const text = String(value || '');
      if (!text || text === '-') return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const temporary = document.createElement('textarea');
          temporary.value = text;
          temporary.setAttribute('readonly', '');
          temporary.style.position = 'fixed';
          temporary.style.opacity = '0';
          document.body.append(temporary);
          temporary.select();
          const copied = document.execCommand('copy');
          temporary.remove();
          if (!copied) throw new Error('copy failed');
        }
        toast('해당 항목이 임시 저장되었습니다. 붙여넣기 하십시오.', 'success', 5000);
      } catch (_) {
        toast('클립보드에 복사하지 못했습니다.', 'error', 5000);
      }
    }

    async function exportCurrentResults() {
      if (EDITION !== 'pc' || state.exporting) return;
      if (hasActiveInlineWork()) {
        toast('입력값 저장이 끝난 뒤 다운로드해 주세요.', 'error');
        return;
      }
      if (!state.lastFilters) {
        toast('먼저 검색해 주세요.', 'error');
        return;
      }

      state.exporting = true;
      setExportBusy(true);
      setSyncState('busy', '다운로드 중');
      try {
        const data = await api('export', { filters: { ...state.lastFilters } });
        const headers = Array.isArray(data.headers) ? data.headers : [];
        const rows = Array.isArray(data.rows) ? data.rows : [];
        if (headers.length !== 21 || rows.some(row => !Array.isArray(row) || row.length !== 21)) {
          throw new ApiError('INVALID_EXPORT', '엑셀 데이터 형식을 확인할 수 없습니다.');
        }
        const workbook = createXlsxWorkbook(headers, rows);
        downloadBlob(workbook, exportFilename());
        setSyncState('online', timeLabel(data.serverTime));
        toast('엑셀 파일을 다운로드했습니다.', 'success');
      } catch (error) {
        setSyncState('error', '다운로드 실패');
        toast(error && error.message ? error.message : '엑셀 다운로드에 실패했습니다.', 'error');
      } finally {
        state.exporting = false;
        setExportBusy(false);
      }
    }

    function setExportBusy(busy) {
      if (!elements.exportButton) return;
      elements.exportButton.disabled = busy || state.exporting || hasActiveInlineWork() || !state.lastFilters || state.records.length === 0;
      const label = elements.exportButton.querySelector('span');
      if (label) label.textContent = busy ? '다운로드 중' : '엑셀 다운로드';
    }

    function exportFilename() {
      const now = new Date();
      const pad = value => String(value).padStart(2, '0');
      const date = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      return `${EXPORT_FILE_PREFIX}(${date}).xlsx`;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.style.display = 'none';
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function createXlsxWorkbook(headers, rows) {
      if (rows.length > 1048575) throw new Error('엑셀에서 처리할 수 있는 행 수를 초과했습니다.');
      const files = [
        ['[Content_Types].xml', xlsxContentTypesXml()],
        ['_rels/.rels', xlsxPackageRelationshipsXml()],
        ['xl/workbook.xml', xlsxWorkbookXml()],
        ['xl/_rels/workbook.xml.rels', xlsxWorkbookRelationshipsXml()],
        ['xl/styles.xml', xlsxStylesXml()],
        ['xl/worksheets/sheet1.xml', xlsxWorksheetXml(headers, rows)],
      ];
      const archive = createStoredZip(files);
      return new Blob([archive], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }

    function xlsxContentTypesXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + '</Types>';
    }

    function xlsxPackageRelationshipsXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>';
    }

    function xlsxWorkbookXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
        + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
        + '<bookViews><workbookView/></bookViews><sheets>'
        + `<sheet name="${xmlText(EXPORT_SHEET_NAME)}" sheetId="1" r:id="rId1"/>`
        + '</sheets></workbook>';
    }

    function xlsxWorkbookRelationshipsXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
        + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
        + '</Relationships>';
    }

    function xlsxStylesXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
        + '<fonts count="2">'
        + '<font><sz val="11"/><color rgb="FF2E1B25"/><name val="Calibri"/><family val="2"/></font>'
        + '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>'
        + '</fonts>'
        + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
        + '<fill><patternFill patternType="solid"><fgColor rgb="FFBB1B66"/><bgColor indexed="64"/></patternFill></fill></fills>'
        + '<borders count="2"><border/><border>'
        + '<left style="thin"><color rgb="FFF0D6E2"/></left><right style="thin"><color rgb="FFF0D6E2"/></right>'
        + '<top style="thin"><color rgb="FFF0D6E2"/></top><bottom style="thin"><color rgb="FFE6BACD"/></bottom>'
        + '<diagonal/></border></borders>'
        + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
        + '<cellXfs count="3">'
        + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
        + '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
        + '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'
        + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
        + '</styleSheet>';
    }

    function xlsxWorksheetXml(headers, rows) {
      const widths = [13, 12, 11, 8, 8, 14, 22, 13, 16, 16, 12, 24, 24, 24, 14, 22, 14, 14, 18, 15, 15];
      const lastRow = rows.length + 1;
      const parts = [
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
        '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
        '<dimension ref="A1:U', String(lastRow), '"/>',
        '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>',
        '<sheetFormatPr defaultRowHeight="20"/>',
        '<cols>',
      ];
      widths.forEach((width, index) => {
        const column = index + 1;
        parts.push(`<col min="${column}" max="${column}" width="${width}" customWidth="1"/>`);
      });
      parts.push('</cols><sheetData>');
      parts.push('<row r="1" ht="28" customHeight="1">');
      headers.forEach((value, index) => parts.push(xlsxInlineCell(columnName(index + 1) + '1', value, 1)));
      parts.push('</row>');
      rows.forEach((row, rowIndex) => {
        const excelRow = rowIndex + 2;
        parts.push(`<row r="${excelRow}">`);
        for (let columnIndex = 0; columnIndex < 21; columnIndex += 1) {
          parts.push(xlsxInlineCell(columnName(columnIndex + 1) + excelRow, row[columnIndex], 2));
        }
        parts.push('</row>');
      });
      parts.push(`</sheetData><autoFilter ref="A1:U${lastRow}"/>`);
      parts.push('<pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/>');
      parts.push('</worksheet>');
      return parts.join('');
    }

    function xlsxInlineCell(reference, value, styleIndex) {
      const text = xmlText(value);
      return `<c r="${reference}" s="${styleIndex}" t="inlineStr"><is><t xml:space="preserve">${text}</t></is></c>`;
    }

    function xmlText(value) {
      return String(value == null ? '' : value)
        .slice(0, 32767)
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function columnName(number) {
      let result = '';
      for (let current = number; current > 0; current = Math.floor((current - 1) / 26)) {
        result = String.fromCharCode(65 + ((current - 1) % 26)) + result;
      }
      return result;
    }

    function createStoredZip(entries) {
      const encoder = new TextEncoder();
      const now = new Date();
      const year = Math.min(2107, Math.max(1980, now.getFullYear()));
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
      const dosDate = ((year - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      entries.forEach(([name, content]) => {
        const nameBytes = encoder.encode(name);
        const data = typeof content === 'string' ? encoder.encode(content) : content;
        const checksum = crc32(data);
        const localHeader = new Uint8Array(30);
        const localView = new DataView(localHeader.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, dosTime, true);
        localView.setUint16(12, dosDate, true);
        localView.setUint32(14, checksum, true);
        localView.setUint32(18, data.length, true);
        localView.setUint32(22, data.length, true);
        localView.setUint16(26, nameBytes.length, true);
        localView.setUint16(28, 0, true);
        localParts.push(localHeader, nameBytes, data);

        const centralHeader = new Uint8Array(46);
        const centralView = new DataView(centralHeader.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, dosTime, true);
        centralView.setUint16(14, dosDate, true);
        centralView.setUint32(16, checksum, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, nameBytes.length, true);
        centralView.setUint16(30, 0, true);
        centralView.setUint16(32, 0, true);
        centralView.setUint16(34, 0, true);
        centralView.setUint16(36, 0, true);
        centralView.setUint32(38, 0, true);
        centralView.setUint32(42, offset, true);
        centralParts.push(centralHeader, nameBytes);
        offset += localHeader.length + nameBytes.length + data.length;
      });

      const centralDirectory = joinBytes(centralParts);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(4, 0, true);
      endView.setUint16(6, 0, true);
      endView.setUint16(8, entries.length, true);
      endView.setUint16(10, entries.length, true);
      endView.setUint32(12, centralDirectory.length, true);
      endView.setUint32(16, offset, true);
      endView.setUint16(20, 0, true);
      return joinBytes([...localParts, centralDirectory, end]);
    }

    function joinBytes(parts) {
      const size = parts.reduce((total, part) => total + part.length, 0);
      const joined = new Uint8Array(size);
      let offset = 0;
      parts.forEach(part => {
        joined.set(part, offset);
        offset += part.length;
      });
      return joined;
    }

    let crc32Table = null;
    function crc32(bytes) {
      if (!crc32Table) {
        crc32Table = new Uint32Array(256);
        for (let index = 0; index < 256; index += 1) {
          let value = index;
          for (let bit = 0; bit < 8; bit += 1) value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
          crc32Table[index] = value >>> 0;
        }
      }
      let checksum = 0xffffffff;
      for (let index = 0; index < bytes.length; index += 1) {
        checksum = crc32Table[(checksum ^ bytes[index]) & 0xff] ^ (checksum >>> 8);
      }
      return (checksum ^ 0xffffffff) >>> 0;
    }

    function metaRow(label, value, full = false, statusClass = '') {
      const row = makeElement('div', '', ['meta-row', full ? 'full' : '', statusClass].filter(Boolean).join(' '));
      const text = makeElement('span', value || '-');
      text.title = value || '';
      row.append(makeElement('small', label), text);
      return row;
    }

    function enrollmentStatusClass(value) {
      if (value === '재학생') return 'is-current';
      if (value === '졸업생') return 'is-graduate';
      return '';
    }

    function changeSort(key) {
      if (state.sortKey === key) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDirection = 'asc'; }
      syncSortControls();
      renderResults();
    }

    function syncSortControls() {
      elements.mobileSortSelect.value = state.sortKey;
      elements.mobileSortDirection.classList.toggle('is-desc', state.sortDirection === 'desc');
      elements.mobileSortDirection.setAttribute('aria-label', `정렬 방향: ${state.sortDirection === 'asc' ? '오름차순' : '내림차순'}`);
    }

    function displayValue(record, key) {
      if (key === 'birthdate') return normalizeBirthdate(record[key]);
      if (key === 'admissionName') return cleanAdmissionName(record[key]);
      return record[key] || '-';
    }

    function normalizeBirthdate(value) {
      const digits = String(value || '').replace(/\D/g, '');
      return digits.length >= 6 ? digits.slice(-6) : (digits || '-');
    }

    function cleanAdmissionName(value) {
      const cleaned = String(value || '')
        .replace(/[\r\n\t]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return cleaned || '-';
    }

    function resultValues(record) {
      return {
        stage1: record.stage1Locked ? '일괄합산' : String(record.stage1 || ''),
        finalResult: String(record.finalResult || ''),
        failureReason: String(record.failureReason || ''),
        waitPrediction: Boolean(record.waitPrediction),
        firstWait: String(record.firstWait || ''),
        finalWait: String(record.finalWait || ''),
      };
    }

    function normalizeFilterSnapshot(filters) {
      const source = filters && typeof filters === 'object' ? filters : {};
      const migrated = {
        ...source,
        name: source.name || source.detailName || '',
        university: source.university || source.detailUniversity || '',
        admissionName: source.admissionName || source.detailAdmissionName || '',
      };
      const normalized = {};
      FILTER_KEYS.forEach(key => {
        normalized[key] = ['includeCampuses','reviewOnly'].includes(key)
          ? Boolean(migrated[key])
          : String(migrated[key] || '');
      });
      return normalized;
    }

    function normalizePendingDraft(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const recordId = String(raw.recordId || '').slice(0, 128);
      const expectedVersion = String(raw.expectedVersion || '').slice(0, 128);
      const updatedAt = Number(raw.updatedAt) || Date.now();
      if (!recordId || !expectedVersion || Date.now() - updatedAt > PENDING_DRAFT_TTL_MS) return null;

      const values = {};
      const baseValues = {};
      RESULT_KEYS.forEach(key => {
        if (key === 'waitPrediction') {
          values[key] = Boolean(raw.values && raw.values[key]);
          baseValues[key] = Boolean(raw.baseValues && raw.baseValues[key]);
          return;
        }
        values[key] = String(raw.values && raw.values[key] || '');
        baseValues[key] = String(raw.baseValues && raw.baseValues[key] || '');
      });
      if (!/^\d{0,6}$/.test(values.firstWait) || !/^\d{0,6}$/.test(values.finalWait)) return null;
      if (![...RESULT_DEFINITIONS.stage1.options, '일괄합산'].includes(values.stage1)
        || !RESULT_DEFINITIONS.finalResult.options.includes(values.finalResult)
        || !RESULT_DEFINITIONS.failureReason.options.includes(values.failureReason)) return null;

      const changedKeys = [...new Set((Array.isArray(raw.changedKeys) ? raw.changedKeys : [])
        .map(key => String(key || ''))
        .filter(key => RESULT_KEYS.includes(key)))];
      if (!changedKeys.length) return null;
      return { recordId, values, baseValues, changedKeys, expectedVersion, updatedAt };
    }

    function persistPendingDrafts() {
      if (!DEMO_MODE) return;
      try {
        const pending = new Map(state.recoveredDrafts);
        state.inFlightDrafts.forEach((draft, recordId) => pending.set(recordId, draft));
        state.drafts.forEach((draft, recordId) => pending.set(recordId, draft));
        const conflicts = new Map(state.recoveredConflicts);
        state.conflictedDrafts.forEach((draft, recordId) => conflicts.set(recordId, draft));
        if (!pending.size && !conflicts.size) {
          sessionStorage.removeItem(PENDING_DRAFTS_KEY);
          return;
        }
        const serializeDraft = ([recordId, draft]) => ({
          recordId,
          values: { ...draft.values },
          baseValues: { ...draft.baseValues },
          changedKeys: [...draft.changedKeys],
          expectedVersion: draft.expectedVersion,
          updatedAt: Number(draft.updatedAt) || Date.now(),
        });
        const drafts = [...pending.entries()].map(serializeDraft);
        const conflictDrafts = [...conflicts.entries()].map(serializeDraft);
        sessionStorage.setItem(PENDING_DRAFTS_KEY, JSON.stringify({
          version: 2,
          drafts,
          conflicts: conflictDrafts,
        }));
      } catch (_) {
        // sessionStorage를 사용할 수 없어도 현재 세션의 자동 저장은 계속합니다.
      }
    }

    function restorePendingDrafts() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(PENDING_DRAFTS_KEY) || 'null');
        if (!stored || ![1, 2].includes(stored.version) || !Array.isArray(stored.drafts)) {
          sessionStorage.removeItem(PENDING_DRAFTS_KEY);
          return;
        }
        stored.drafts.forEach(raw => {
          const normalized = normalizePendingDraft(raw);
          if (normalized) {
            const { recordId, ...draft } = normalized;
            state.recoveredDrafts.set(recordId, draft);
          }
        });
        if (stored.version === 2 && Array.isArray(stored.conflicts)) {
          stored.conflicts.forEach(raw => {
            const normalized = normalizePendingDraft(raw);
            if (normalized) {
              const { recordId, ...draft } = normalized;
              state.recoveredConflicts.set(recordId, draft);
            }
          });
        }
        state.recoveryFilters = {};
        persistPendingDrafts();
      } catch (_) {
        sessionStorage.removeItem(PENDING_DRAFTS_KEY);
      }
    }

    function applyFilterSnapshot(filters) {
      const values = normalizeFilterSnapshot(filters);
      elements.universityInput.value = values.university;
      elements.nameInput.value = values.name;
      elements.admissionInput.value = values.admissionName;
      elements.recruitmentUnitInput.value = values.recruitmentUnit;
      elements.universityTypeSelect.value = values.universityType;
      elements.enrollmentSelect.value = values.enrollment;
      elements.classSelect.value = values.classNo;
      elements.admissionTypeSelect.value = values.admissionType;
      elements.includeCampusesToggle.checked = Boolean(values.includeCampuses);
      $('reviewOnly').checked=Boolean(values.reviewOnly);
    }

    function resumeRecoveredDrafts() {
      if ((!state.recoveredDrafts.size && !state.recoveredConflicts.size) || state.searching || state.lastFilters
        || !hasFilter(state.recoveryFilters || {}) || !navigator.onLine
        || (!DEMO_MODE && !currentSessionToken())) return;
      applyFilterSnapshot(state.recoveryFilters);
      performSearch({ silent: false, manual: false });
    }

    function adoptRecoveredDrafts(records) {
      let adopted = 0;
      let adoptedConflicts = 0;
      records.forEach(record => {
        const recovered = state.recoveredDrafts.get(record.id);
        if (recovered && !state.drafts.has(record.id) && !state.inFlightDrafts.has(record.id)) {
          const changedKeys = recovered.changedKeys.filter(key => !(record.stage1Locked && key === 'stage1'));
          state.recoveredDrafts.delete(record.id);
          if (changedKeys.length) {
            const values = resultValues(record);
            changedKeys.forEach(key => { values[key] = recovered.values[key]; });
            if (changedKeys.includes('stage1')) {
              applyStage1Cascade(record, values, 'stage1', resultValues(record).stage1);
            }
            if (record.stage1Locked) values.stage1 = '일괄합산';
            state.drafts.set(record.id, {
              values,
              baseValues: { ...recovered.baseValues },
              changedKeys,
              expectedVersion: recovered.expectedVersion,
              updatedAt: recovered.updatedAt,
            });
            adopted += 1;
          }
        }

        const recoveredConflict = state.recoveredConflicts.get(record.id);
        if (!recoveredConflict || state.conflictedDrafts.has(record.id)) return;
        const conflictKeys = recoveredConflict.changedKeys
          .filter(key => !(record.stage1Locked && key === 'stage1'));
        state.recoveredConflicts.delete(record.id);
        if (!conflictKeys.length) return;
        const serverValues = resultValues(record);
        const conflictValues = { ...serverValues };
        conflictKeys.forEach(key => { conflictValues[key] = recoveredConflict.values[key]; });
        if (record.stage1Locked) conflictValues.stage1 = '일괄합산';
        state.conflictedDrafts.set(record.id, {
          values: conflictValues,
          baseValues: serverValues,
          changedKeys: conflictKeys,
          expectedVersion: record.version,
          updatedAt: recoveredConflict.updatedAt,
        });
        adoptedConflicts += 1;
      });
      persistPendingDrafts();
      if (adopted || adoptedConflicts) {
        if (!state.recoveryToastShown) {
          toast(`임시 저장된 입력 ${adopted + adoptedConflicts}건을 복구했습니다.`, 'success', 4200);
          state.recoveryToastShown = true;
        }
        queueMicrotask(() => {
          retryAllDrafts({ immediate: true });
          openNextConflictDialog();
        });
      }
      return adopted + adoptedConflicts;
    }

    function clearDraftRetry(recordId, resetAttempts = false) {
      const timer = state.retryTimers.get(recordId);
      if (timer) clearTimeout(timer);
      state.retryTimers.delete(recordId);
      if (resetAttempts) state.retryAttempts.delete(recordId);
    }

    function scheduleDraftRetry(recordId, { immediate = false } = {}) {
      if (!state.drafts.has(recordId) || state.saving.has(recordId)) return;
      clearDraftRetry(recordId);
      const attempts = state.retryAttempts.get(recordId) || 0;
      const retryExponent = Math.min(attempts, SAVE_RETRY_MAX_ATTEMPTS);
      const delay = immediate ? 0 : Math.min(SAVE_RETRY_MAX_MS, SAVE_RETRY_BASE_MS * (2 ** retryExponent));
      if (!immediate) state.retryAttempts.set(recordId, Math.min(attempts + 1, SAVE_RETRY_MAX_ATTEMPTS));
      const timer = setTimeout(() => {
        state.retryTimers.delete(recordId);
        if (!state.drafts.has(recordId) || state.saving.has(recordId)) return;
        if (!navigator.onLine || (!DEMO_MODE && !currentSessionToken())) {
          scheduleDraftRetry(recordId);
          return;
        }
        saveInlineResult(recordId);
      }, delay);
      state.retryTimers.set(recordId, timer);
    }

    function scheduleResultReconciliation(delay = 250) {
      clearTimeout(state.reconcileTimer);
      state.reconcileTimer = setTimeout(() => {
        state.reconcileTimer = null;
        if (!state.lastFilters) return;
        if (state.conflictedDrafts.size) return;
        if (hasActiveInlineWork() || state.searching) {
          scheduleResultReconciliation(350);
          return;
        }
        performSearch({ silent: true, manual: false });
      }, delay);
    }

    function retryAllDrafts({ immediate = false } = {}) {
      state.drafts.forEach((_, recordId) => {
        if (immediate) clearDraftRetry(recordId, true);
        if (immediate) saveInlineResult(recordId);
        else scheduleDraftRetry(recordId);
      });
    }

    function drainQueuedSaves() {
      if (!navigator.onLine || (!DEMO_MODE && !currentSessionToken())) return;
      for (const recordId of state.drafts.keys()) {
        if (state.saving.size >= MAX_CONCURRENT_SAVES) break;
        // A failed save owns a backoff timer. Do not let the queue drain turn
        // it into an immediate retry storm; the durable draft remains stored.
        if (!state.saving.has(recordId) && !state.retryTimers.has(recordId)) {
          saveInlineResult(recordId);
        }
      }
    }

    function hasPendingResultWork() {
      return state.drafts.size > 0 || state.inFlightDrafts.size > 0
        || state.recoveredDrafts.size > 0 || state.conflictedDrafts.size > 0
        || state.recoveredConflicts.size > 0 || state.saving.size > 0;
    }

    function currentResultValues(record) {
      const values = resultValues(record);
      const inFlight = state.inFlightDrafts.get(record.id);
      const draft = state.drafts.get(record.id);
      const conflict = state.conflictedDrafts.get(record.id);
      [inFlight, draft, conflict].forEach(source => {
        if (!source) return;
        source.changedKeys.forEach(key => { values[key] = source.values[key]; });
      });
      return values;
    }

    function isStepwiseSelection(record) {
      return String(record.selectionType || '').replace(/\s+/g, '').includes('단계별');
    }

    function applyStage1Cascade(record, values, changedKey, previousStage1) {
      if (!DEMO_MODE || !isStepwiseSelection(record) || changedKey !== 'stage1') return;
      if (DEMO_MODE && values.stage1 === '불합격') {
        values.finalResult = '불합격';
        values.failureReason = '1단계 불합격';
      } else if (
        previousStage1 === '불합격' &&
        values.finalResult === '불합격' &&
        values.failureReason === '1단계 불합격'
      ) {
        values.finalResult = '';
        values.failureReason = '';
      }
    }

    function outcomeTone(value){return ['합격','충원합격'].includes(value)?'pass':value==='불합격'?'fail':value==='예비'?'wait':'unknown';}
    function makeInlineResultField(record, key, showLabel, showFeedback) {
      const definition = RESULT_DEFINITIONS[key];
      const field = makeElement('div', '', showLabel ? 'card-result-field' : 'result-input-wrap');
      field.dataset.recordId = record.id;
      field.dataset.resultKey = key;
      if (showLabel) field.append(makeElement('label', definition.label));

      if (key === 'stage1' && record.stage1Locked) {
        field.classList.add('is-locked');
        const locked = makeElement('span', '일괄합산', 'stage1-locked');
        locked.title = '일괄합산';
        field.append(locked);
      } else {
        const values = currentResultValues(record);
        let control;
        if (definition.type === 'checkbox') {
          control = document.createElement('input');
          control.type = 'checkbox';
          control.checked = Boolean(values[key]);
          control.addEventListener('change', event => {
            event.stopPropagation();
            syncResultFieldFilledState(field, control.checked);
            setDraftValue(record.id, key, control.checked);
            saveInlineResult(record.id);
          });
        } else if (definition.type === 'select') {
          control = document.createElement('select');
          definition.options.forEach(optionValue => control.append(makeOption(optionValue, optionValue || '미입력')));
          control.value = values[key] || '';
          control.addEventListener('change', event => {
            event.stopPropagation();
            syncResultFieldFilledState(field, Boolean(control.value));
            setDraftValue(record.id, key, control.value);
            saveInlineResult(record.id);
          });
        } else {
          control = document.createElement('input');
          control.type = 'text';
          control.inputMode = 'numeric';
          control.autocomplete = 'off';
          control.maxLength = 6;
          control.placeholder = '클릭 후 입력';
          control.value = values[key] || '';
          control.addEventListener('input', event => {
            event.stopPropagation();
            const sanitized = control.value.replace(/\D/g, '').slice(0, 6);
            if (control.value !== sanitized) control.value = sanitized;
            setDraftValue(record.id, key, sanitized);
            control.classList.toggle('is-filled', Boolean(sanitized));
            syncResultFieldFilledState(field, Boolean(sanitized));
          });
          control.addEventListener('change', event => { event.stopPropagation(); saveInlineResult(record.id); });
          control.addEventListener('blur', () => saveInlineResult(record.id));
          control.addEventListener('keydown', event => {
            event.stopPropagation();
            if (event.key === 'Enter') { event.preventDefault(); control.blur(); }
          });
        }
        control.className = 'inline-result-control' + (definition.type === 'checkbox' ? ' inline-result-checkbox' : '') +
          ((definition.type === 'checkbox' ? control.checked : control.value) ? ' is-filled' : '');
        syncResultFieldFilledState(field, definition.type === 'checkbox' ? control.checked : Boolean(control.value));
        control.dataset.recordId = record.id;
        control.dataset.resultKey = key;
        control.dataset.outcome = outcomeTone(values[key]);
        control.setAttribute('aria-label', `${record.name || ''} ${definition.label}`.trim());
        control.disabled = !DEMO_MODE && (existingUser?.role !== 'admin' || !existingFields[key]);
        if (control.disabled){control.title='교사용 조회 전용';if(control.tagName==='INPUT')control.placeholder='-';}
        control.addEventListener('click', event => event.stopPropagation());
        if (definition.type === 'checkbox') {
          const toggle = makeElement('div', '', 'prediction-toggle');
          toggle.title = definition.help;
          const indicator = makeElement('span', '', 'prediction-indicator');
          indicator.setAttribute('aria-hidden', 'true');
          indicator.append(makeSvgIcon('<path d="m5 12 4 4L19 7"/>'));
          toggle.append(control, indicator);
          field.append(toggle);
        } else {
          field.append(control);
        }
      }

      return field;
    }

    function syncResultFieldFilledState(field, filled) {
      field.classList.toggle('is-filled', filled);
      const cell = field.closest('.cell-result');
      if (cell) cell.classList.toggle('is-filled', filled);
    }

    function setDraftValue(recordId, key, value) {
      const record = state.records.find(item => item.id === recordId);
      if (!record) return;
      const conflict = state.conflictedDrafts.get(recordId);
      if (conflict && conflict.changedKeys.includes(key)) {
        const values = { ...conflict.values };
        const previousStage1 = values.stage1;
        values[key] = value;
        applyStage1Cascade(record, values, key, previousStage1);
        if (record.stage1Locked) values.stage1 = '일괄합산';
        if (key === 'stage1' && isStepwiseSelection(record)) {
          ['stage1', 'finalResult', 'failureReason'].forEach(conflictKey => {
            if (!conflict.changedKeys.includes(conflictKey)) conflict.changedKeys.push(conflictKey);
          });
        }
        conflict.values = values;
        conflict.updatedAt = Date.now();
        persistPendingDrafts();
        syncDraftControls(recordId, currentResultValues(record), record);
        openNextConflictDialog();
        return;
      }
      const existing = state.drafts.get(recordId);
      const inFlight = state.inFlightDrafts.get(recordId);
      const values = existing
        ? { ...existing.values }
        : (inFlight ? { ...inFlight.values } : currentResultValues(record));
      const previousStage1 = values.stage1;
      values[key] = value;
      applyStage1Cascade(record, values, key, previousStage1);
      if (record.stage1Locked) values.stage1 = '일괄합산';
      const changedKeys = new Set(existing ? existing.changedKeys : []);
      changedKeys.add(key);
      if (key === 'stage1' && isStepwiseSelection(record)) {
        changedKeys.add('finalResult');
        changedKeys.add('failureReason');
      }
      state.drafts.set(recordId, {
        values,
        baseValues: existing ? existing.baseValues : (inFlight ? inFlight.baseValues : resultValues(record)),
        changedKeys: [...changedKeys],
        expectedVersion: existing ? existing.expectedVersion : (inFlight ? inFlight.expectedVersion : record.version),
        updatedAt: Date.now(),
      });
      persistPendingDrafts();
      syncDraftControls(recordId, values, record);
      setExportBusy(state.exporting);
    }

    function syncDraftControls(recordId, values, record) {
      document.querySelectorAll('.inline-result-control').forEach(control => {
        if (control.dataset.recordId !== recordId) return;
        const key = control.dataset.resultKey;
        if (!key || !(key in values)) return;
        if (control.type === 'checkbox') control.checked = Boolean(values[key]);
        else if (control.value !== values[key]) control.value = values[key];
        control.classList.toggle('is-filled', Boolean(values[key]));
        control.dataset.outcome=outcomeTone(values[key]);
        const field = control.closest('.result-input-wrap, .card-result-field');
        if (field) syncResultFieldFilledState(field, Boolean(values[key]));
        control.disabled = !DEMO_MODE && (existingUser?.role !== 'admin' || !existingFields[key]);
        control.title = control.disabled ? '교사용 조회 전용' : '';
      });
    }

    function setRecordControlsBusy(recordId, busy) {
      document.querySelectorAll('.inline-result-control').forEach(control => {
        if (control.dataset.recordId === recordId) control.setAttribute('aria-busy', String(busy));
      });
    }

    function syncSavingOverlay() {
      elements.savingOverlay.hidden = state.saving.size === 0;
    }

    function rebaseQueuedDraft(recordId, currentRecord) {
      const queued = state.drafts.get(recordId);
      if (!queued) return;
      const values = resultValues(currentRecord);
      queued.changedKeys.forEach(key => { values[key] = queued.values[key]; });
      if (queued.changedKeys.includes('stage1')) {
        applyStage1Cascade(currentRecord, values, 'stage1', resultValues(currentRecord).stage1);
      }
      queued.values = values;
      queued.baseValues = resultValues(currentRecord);
      queued.expectedVersion = currentRecord.version;
    }

    function mergeDraftIntent(failedDraft, queuedDraft) {
      const values = { ...failedDraft.values };
      const changedKeys = new Set(failedDraft.changedKeys);
      if (queuedDraft) {
        queuedDraft.changedKeys.forEach(key => {
          changedKeys.add(key);
          values[key] = queuedDraft.values[key];
        });
      }
      return {
        values,
        changedKeys: [...changedKeys],
        updatedAt: Math.max(Number(failedDraft.updatedAt) || 0, Number(queuedDraft?.updatedAt) || 0, Date.now()),
      };
    }

    function makeRebasedDraft(currentRecord, intent, changedKeys) {
      const baseValues = resultValues(currentRecord);
      const values = { ...baseValues };
      changedKeys.forEach(key => { values[key] = intent.values[key]; });
      if (currentRecord.stage1Locked) values.stage1 = '일괄합산';
      return {
        values,
        baseValues,
        changedKeys: [...changedKeys],
        expectedVersion: currentRecord.version,
        updatedAt: intent.updatedAt || Date.now(),
      };
    }

    function restoreDraftAfterConflict(recordId, failedDraft, currentRecord) {
      const queued = state.drafts.get(recordId);
      state.drafts.delete(recordId);
      const intent = mergeDraftIntent(failedDraft, queued);
      state.drafts.set(recordId, makeRebasedDraft(currentRecord, intent, intent.changedKeys));
      return true;
    }

    function preserveFieldConflict(recordId, failedDraft, currentRecord, conflictingFields) {
      const queued = state.drafts.get(recordId);
      state.drafts.delete(recordId);
      const intent = mergeDraftIntent(failedDraft, queued);
      const reported = (Array.isArray(conflictingFields) ? conflictingFields : [])
        .filter(key => RESULT_KEYS.includes(key));
      const conflictKeys = new Set(reported.length ? reported : intent.changedKeys);
      const cascadeKeys = ['stage1', 'finalResult', 'failureReason'];
      if (isStepwiseSelection(currentRecord) && intent.changedKeys.includes('stage1')
        && cascadeKeys.some(key => conflictKeys.has(key))) {
        cascadeKeys.forEach(key => conflictKeys.add(key));
      }
      const preservedKeys = [...conflictKeys]
        .filter(key => RESULT_KEYS.includes(key) && !(currentRecord.stage1Locked && key === 'stage1'));
      const nonconflictingKeys = intent.changedKeys.filter(key => !conflictKeys.has(key));

      if (nonconflictingKeys.length) {
        state.drafts.set(recordId, makeRebasedDraft(currentRecord, intent, nonconflictingKeys));
      }
      if (preservedKeys.length) {
        const existing = state.conflictedDrafts.get(recordId);
        const combinedKeys = new Set(existing ? existing.changedKeys : []);
        preservedKeys.forEach(key => combinedKeys.add(key));
        const combinedValues = { ...intent.values };
        if (existing) existing.changedKeys.forEach(key => { combinedValues[key] = existing.values[key]; });
        preservedKeys.forEach(key => { combinedValues[key] = intent.values[key]; });
        const combinedIntent = {
          values: combinedValues,
          updatedAt: Math.max(Number(existing?.updatedAt) || 0, Number(intent.updatedAt) || 0),
        };
        state.conflictedDrafts.set(
          recordId,
          makeRebasedDraft(currentRecord, combinedIntent, [...combinedKeys])
        );
      }
      return nonconflictingKeys.length > 0;
    }

    function rebaseConflictedDraft(recordId, currentRecord) {
      const conflict = state.conflictedDrafts.get(recordId);
      if (!conflict) return;
      state.conflictedDrafts.set(
        recordId,
        makeRebasedDraft(currentRecord, conflict, conflict.changedKeys)
      );
      if (state.activeConflictRecordId === recordId && elements.conflictDialog.open) {
        renderConflictDialog(recordId);
      }
    }

    function conflictValueLabel(value) {
      return String(value || '').trim() || '미입력';
    }

    function renderConflictDialog(recordId) {
      const conflict = state.conflictedDrafts.get(recordId);
      const record = state.records.find(item => item.id === recordId);
      if (!conflict || !record) return false;
      elements.conflictMessage.textContent = `${record.name} · ${record.university}의 같은 항목이 다른 화면에서도 변경되었습니다.`;
      const fragment = document.createDocumentFragment();
      conflict.changedKeys.forEach(key => {
        const definition = RESULT_DEFINITIONS[key];
        if (!definition) return;
        const row = makeElement('div', '', 'conflict-row');
        row.append(makeElement('span', definition.label, 'conflict-label'));
        const server = makeElement('div', '', 'conflict-value');
        server.append(makeElement('small', '현재 값'), makeElement('strong', conflictValueLabel(conflict.baseValues[key])));
        const local = makeElement('div', '', 'conflict-value is-local');
        local.append(makeElement('small', '내 입력'), makeElement('strong', conflictValueLabel(conflict.values[key])));
        row.append(server, local);
        fragment.append(row);
      });
      elements.conflictList.replaceChildren(fragment);
      return true;
    }

    function openNextConflictDialog() {
      if (elements.conflictDialog.open) {
        if (state.activeConflictRecordId) renderConflictDialog(state.activeConflictRecordId);
        return;
      }
      const next = [...state.conflictedDrafts.keys()]
        .find(recordId => state.records.some(record => record.id === recordId));
      if (!next || !renderConflictDialog(next)) {
        state.activeConflictRecordId = '';
        return;
      }
      state.activeConflictRecordId = next;
      setSyncState('error', '입력 확인 필요');
      elements.conflictDialog.showModal();
    }

    function closeResolvedConflictDialog() {
      state.activeConflictRecordId = '';
      if (elements.conflictDialog.open) elements.conflictDialog.close();
      renderResults();
      persistPendingDrafts();
      queueMicrotask(openNextConflictDialog);
      drainQueuedSaves();
      if (!state.conflictedDrafts.size) scheduleResultReconciliation();
    }

    function keepServerConflictValue() {
      const recordId = state.activeConflictRecordId;
      if (!recordId) return;
      state.conflictedDrafts.delete(recordId);
      clearDraftRetry(recordId, true);
      if (!state.conflictedDrafts.size) setSyncState('online', '연결됨');
      closeResolvedConflictDialog();
    }

    function applyLocalConflictValue() {
      const recordId = state.activeConflictRecordId;
      const conflict = state.conflictedDrafts.get(recordId);
      const record = state.records.find(item => item.id === recordId);
      if (!conflict || !record) return;
      const queued = state.drafts.get(recordId);
      const inFlight = state.inFlightDrafts.get(recordId);
      const values = queued
        ? { ...queued.values }
        : (inFlight ? { ...inFlight.values } : resultValues(record));
      conflict.changedKeys.forEach(key => { values[key] = conflict.values[key]; });
      const changedKeys = new Set(queued ? queued.changedKeys : []);
      conflict.changedKeys.forEach(key => changedKeys.add(key));
      state.drafts.set(recordId, {
        values,
        baseValues: queued ? queued.baseValues : (inFlight ? inFlight.baseValues : resultValues(record)),
        changedKeys: [...changedKeys],
        expectedVersion: queued ? queued.expectedVersion : (inFlight ? inFlight.expectedVersion : record.version),
        updatedAt: Date.now(),
      });
      state.conflictedDrafts.delete(recordId);
      clearDraftRetry(recordId, true);
      closeResolvedConflictDialog();
      if (!state.saving.has(recordId)) queueMicrotask(() => saveInlineResult(recordId));
    }

    async function saveInlineResult(recordId) {
      if (state.saving.has(recordId)) return;
      // A single browser can otherwise launch many Apps Script executions at
      // once. Every save is durable in state.drafts/localStorage; two active
      // requests keep the UI responsive without building a global lock queue.
      if (state.saving.size >= MAX_CONCURRENT_SAVES) return;
      const record = state.records.find(item => item.id === recordId);
      const draft = state.drafts.get(recordId);
      if (!record || !draft) return;
      clearDraftRetry(recordId);
      const values = { ...draft.values };
      if (!/^\d{0,6}$/.test(values.firstWait) || !/^\d{0,6}$/.test(values.finalWait)) {
        state.drafts.delete(recordId);
        clearDraftRetry(recordId, true);
        persistPendingDrafts();
        renderResults();
        toast('충원번호는 숫자만 입력해 주세요.', 'error');
        return;
      }
      state.drafts.delete(recordId);
      state.inFlightDrafts.set(recordId, draft);
      state.saving.add(recordId);
      persistPendingDrafts();
      syncSavingOverlay();
      setRecordControlsBusy(recordId, true);
      setSyncState('busy', '반영 중');
      let saved = false;
      let shouldRetry = false;
      let needsConflictChoice = false;
      try {
        const data = await api('save', {
          recordId: record.id,
          rowNumber: record.rowNumber,
          expectedVersion: draft.expectedVersion,
          values,

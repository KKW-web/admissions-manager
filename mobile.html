          baseValues: draft.baseValues,
          changedKeys: draft.changedKeys,
        });
        replaceRecord(data.record);
        state.searchCache.clear();
        state.dataRevision = String(data.revision == null ? state.dataRevision : data.revision);
        scheduleMetaRefresh(data.sourceRevision || data.revision);
        state.recordsSignature = makeRecordsSignature(
          state.records,
          state.lastTotalMatches,
          state.lastTruncated
        );
        rebaseQueuedDraft(recordId, data.record);
        rebaseConflictedDraft(recordId, data.record);
        saved = true;
        if (state.conflictedDrafts.size) setSyncState('error', '입력 확인 필요');
        else setSyncState('online', timeLabel(data.serverTime));
      } catch (error) {
        if ((error.code === 'CONFLICT' || error.code === 'FIELD_CONFLICT') && error.details && error.details.current) {
          replaceRecord(error.details.current);
          if (error.code === 'FIELD_CONFLICT') {
            shouldRetry = preserveFieldConflict(
              recordId,
              draft,
              error.details.current,
              error.details.conflictingFields
            );
            needsConflictChoice = state.conflictedDrafts.has(recordId);
          } else {
            shouldRetry = restoreDraftAfterConflict(recordId, draft, error.details.current);
          }
        } else {
          const queued = state.drafts.get(recordId);
          if (queued) {
            queued.changedKeys = [...new Set([...draft.changedKeys, ...queued.changedKeys])];
            queued.baseValues = draft.baseValues;
            queued.expectedVersion = draft.expectedVersion;
            queued.updatedAt = Math.max(Number(queued.updatedAt) || 0, Number(draft.updatedAt) || 0);
          } else {
            state.drafts.set(recordId, draft);
          }
          shouldRetry = true;
        }
        setSyncState('error', needsConflictChoice ? '입력 확인 필요' : '저장 실패');
        if (!state.retryAttempts.has(recordId)
          || error.code === 'CONFLICT' || error.code === 'FIELD_CONFLICT') {
          toast(needsConflictChoice ? '다른 입력과 겹친 항목을 확인해 주세요.' : error.message, 'error');
        }
      } finally {
        state.inFlightDrafts.delete(recordId);
        state.saving.delete(recordId);
        renderResults();
        syncSavingOverlay();
        persistPendingDrafts();
        if (needsConflictChoice) openNextConflictDialog();
        if (saved && state.drafts.has(recordId)) {
          clearDraftRetry(recordId, true);
          queueMicrotask(() => saveInlineResult(recordId));
        } else if (saved) {
          clearDraftRetry(recordId, true);
        } else if (shouldRetry && state.drafts.has(recordId)) {
          scheduleDraftRetry(recordId, { immediate: needsConflictChoice });
        } else {
          clearDraftRetry(recordId, true);
        }
        if (saved) scheduleResultReconciliation();
        drainQueuedSaves();
      }
    }

    function replaceRecord(next) {
      const index = state.records.findIndex(item => item.id === next.id);
      if (index >= 0) {
        state.records.splice(index, 1, next);
        state.recordsSignature = makeRecordsSignature(
          state.records,
          state.lastTotalMatches,
          state.lastTruncated
        );
      }
    }

    function updateStickySearchMetrics() {
      const isActive = document.body.classList.contains('has-searched');
      const height = isActive && elements.searchPanel
        ? Math.ceil(elements.searchPanel.getBoundingClientRect().height)
        : 0;
      document.documentElement.style.setProperty('--sticky-search-height', `${height}px`);
      const rootStyle = getComputedStyle(document.documentElement);
      const cssPixels = (name, fallback) => Number.parseFloat(rootStyle.getPropertyValue(name)) || fallback;
      const reservedHeight = cssPixels('--topbar-height', 68)
        + cssPixels('--sticky-search-gap', 12)
        + cssPixels('--sticky-results-bar-height', 58)
        + 28;
      const tableRoom = window.innerHeight - height - reservedHeight;
      document.body.classList.toggle(
        'pc-short-viewport',
        EDITION === 'pc' && isActive && tableRoom < 240
      );
    }

    function updateMobileSearchSummary(filters = state.lastFilters || {}) {
      if (!elements.mobileSearchSummaryText) return;
      const parts = [];
      const add = value => {
        const text = String(value || '').trim();
        if (text && !parts.includes(text)) parts.push(text);
      };
      add(filters.reviewOnly?'검토 필요만':'');
      add(filters.enrollment);
      add(filters.classNo ? `${filters.classNo}반` : '');
      add(filters.name);
      add(filters.university);
      add(filters.admissionName);
      add(filters.recruitmentUnit);
      add(filters.universityType);
      add(filters.admissionType);
      add(filters.includeCampuses ? '제2캠퍼스 포함' : '');
      elements.mobileSearchSummaryText.textContent = parts.join(' · ') || '검색 조건';
      elements.mobileSearchSummaryText.title = parts.join(' · ');
    }

    function setMobileSearchExpanded(expanded) {
      const active = EDITION === 'mobile' && document.body.classList.contains('has-searched');
      const next = Boolean(active && expanded);
      document.body.classList.toggle('mobile-search-expanded', next);
      if (elements.mobileSearchSummary) elements.mobileSearchSummary.setAttribute('aria-expanded', String(next));
      requestAnimationFrame(updateStickySearchMetrics);
    }

    function setSearchLayout(active, { collapseMobile = true } = {}) {
      const wasActive = document.body.classList.contains('has-searched');
      document.body.classList.toggle('has-searched', active);
      if (!active) setMobileSearchExpanded(false);
      if (active && EDITION === 'mobile' && collapseMobile) {
        setMobileSearchExpanded(false);
        toggleDetails(false);
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      }
      requestAnimationFrame(() => {
        updateStickySearchMetrics();
        if (active && !wasActive) window.scrollTo({ top: 0, behavior: 'auto' });
      });
    }

    function toggleDetails(force) {
      const willOpen = typeof force === 'boolean' ? force : elements.detailFilters.hidden;
      if (EDITION === 'mobile' && willOpen && document.body.classList.contains('has-searched')) {
        setMobileSearchExpanded(true);
      }
      elements.detailFilters.hidden = !willOpen;
      [elements.detailToggle, elements.mobileDetailButton].forEach(button => button.setAttribute('aria-expanded', String(willOpen)));
      requestAnimationFrame(updateStickySearchMetrics);
      if (EDITION === 'mobile' && willOpen) {
        setTimeout(() => elements.detailFilters.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30);
      }
    }

    function resetSearch() {
      if (hasPendingResultWork()) {
        persistPendingDrafts();
        toast('입력값 반영이 끝난 뒤 초기화해 주세요.', 'error', 4200);
        return;
      }
      state.pendingManualSearch = false;
      if (state.searchController) state.searchController.abort();
      setSearchBusy(false);
      elements.searchForm.reset();
      state.records = [];
      state.drafts.clear();
      state.inFlightDrafts.clear();
      state.conflictedDrafts.clear();
      state.recoveredConflicts.clear();
      state.activeConflictRecordId = '';
      state.saving.clear();
      state.retryTimers.forEach(timer => clearTimeout(timer));
      state.retryTimers.clear();
      state.retryAttempts.clear();
      clearTimeout(state.reconcileTimer);
      state.reconcileTimer = null;
      syncSavingOverlay();
      state.lastFilters = null;
      state.dataRevision = '';
      state.lastFullSyncAt = 0;
      state.recordsSignature = '';
      state.lastTotalMatches = 0;
      state.lastTruncated = false;
      state.visibleCount = INITIAL_PAGE_SIZE;
      state.sortKey = DEFAULT_SORT_KEY;
      state.sortDirection = DEFAULT_SORT_DIRECTION;
      syncSortControls();
      clearInterval(state.pollingTimer);
      if (state.pollController) state.pollController.abort();
      state.pollController = null;
      persistPendingDrafts();
      setSearchLayout(false);
      renderResults(0, false);
      setSyncState(currentApiUrl() && currentSessionToken() ? 'online' : 'idle', currentApiUrl() && currentSessionToken() ? '연결됨' : '연결 필요');
    }

    const META_STRING_LIST_KEYS = Object.freeze([
      'universityTypes', 'enrollments', 'classes', 'tracks', 'admissionTypes',
      'universities', 'names', 'admissionNames', 'recruitmentUnits',
    ]);
    const META_CONTEXT_LISTS = Object.freeze([
      ['admissionNameIndexesByUniversity', 'admissionNames'],
      ['recruitmentUnitIndexesByUniversity', 'recruitmentUnits'],
    ]);

    function metaStorageKey(apiUrl = currentApiUrl()) {
      return `${META_STORAGE_PREFIX}:${encodeURIComponent(String(apiUrl || ''))}`;
    }

    function metaStorageByteLength(value) {
      const text = String(value || '');
      try { return new TextEncoder().encode(text).byteLength; }
      catch (_) { return text.length * 3; }
    }

    function validMetaOptions(options) {
      if (!options || typeof options !== 'object' || Array.isArray(options)) return false;
      let totalItems = 0;
      for (const key of META_STRING_LIST_KEYS) {
        const values = options[key];
        if (!Array.isArray(values) || values.length > META_STORAGE_MAX_LIST_ITEMS) return false;
        totalItems += values.length;
        if (totalItems > META_STORAGE_MAX_TOTAL_ITEMS) return false;
        if (values.some(value => (
          typeof value !== 'string' || value.length > META_STORAGE_MAX_VALUE_LENGTH
        ))) return false;
      }

      let totalContextIndexes = 0;
      for (const [relationKey, valuesKey] of META_CONTEXT_LISTS) {
        const relations = options[relationKey];
        const valueCount = options[valuesKey].length;
        if (!Array.isArray(relations) || relations.length !== options.universities.length) return false;
        for (const indexes of relations) {
          if (!Array.isArray(indexes) || indexes.length > valueCount) return false;
          totalContextIndexes += indexes.length;
          if (totalContextIndexes > META_STORAGE_MAX_CONTEXT_INDEXES) return false;
          if (indexes.some(index => !Number.isInteger(index) || index < 0 || index >= valueCount)) return false;
        }
      }
      return true;
    }

    function removeStoredMeta(apiUrl = currentApiUrl()) {
      try { sessionStorage.removeItem(metaStorageKey(apiUrl)); } catch (_) { /* 저장소 없이 계속합니다. */ }
    }

    function metaResponseRevision(data) {
      return String(data && (data.sourceRevision || data.revision) || '');
    }

    function readStoredMeta(apiUrl = currentApiUrl()) {
      if (DEMO_MODE || !apiUrl) return null;
      const key = metaStorageKey(apiUrl);
      try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return null;
        if (metaStorageByteLength(raw) > META_STORAGE_MAX_BYTES) throw new Error('META_CACHE_TOO_LARGE');
        const cached = JSON.parse(raw);
        const savedAt = Number(cached && cached.savedAt);
        const now = Date.now();
        const revision = String(cached && cached.revision || '');
        const valid = cached && cached.version === META_STORAGE_VERSION
          && cached.apiUrl === apiUrl
          && revision.length > 0 && revision.length <= 256
          && Number.isFinite(savedAt) && savedAt > 0 && savedAt <= now + 5 * 60 * 1000
          && now - savedAt <= META_STORAGE_MAX_AGE_MS
          && validMetaOptions(cached.options);
        if (!valid) throw new Error('INVALID_META_CACHE');
        return {
          revision,
          savedAt,
          // JSON.parse already produced an isolated object. Cloning every
          // nested list again only doubled the cold-start indexing work.
          options: cached.options,
        };
      } catch (_) {
        try { sessionStorage.removeItem(key); } catch (_) { /* 저장소 없이 계속합니다. */ }
        return null;
      }
    }

    function storeMetaResponse(data, apiUrl = currentApiUrl(), { validated = false } = {}) {
      if (DEMO_MODE || !apiUrl) return false;
      const revision = metaResponseRevision(data);
      const options = data && data.options;
      if (!revision || revision.length > 256 || (!validated && !validMetaOptions(options))) return false;
      const safeOptions = { ...options, names: [] };
      if (!validMetaOptions(safeOptions)) return false;
      const key = metaStorageKey(apiUrl);
      try {
        const raw = JSON.stringify({
          version: META_STORAGE_VERSION,
          apiUrl,
          revision,
          savedAt: Date.now(),
          options: safeOptions,
        });
        if (metaStorageByteLength(raw) > META_STORAGE_MAX_BYTES) {
          sessionStorage.removeItem(key);
          return false;
        }
        sessionStorage.setItem(key, raw);
        return true;
      } catch (_) {
        return false;
      }
    }

    function scheduleMetaPersistence(data) {
      if (DEMO_MODE || !currentApiUrl()) return;
      const revision = metaResponseRevision(data);
      clearTimeout(state.metaPersistTimer);
      state.metaPersistTimer = null;
      if (state.metaPersistIdleId !== null && 'cancelIdleCallback' in window) {
        cancelIdleCallback(state.metaPersistIdleId);
      }
      state.metaPersistIdleId = null;
      const persist = () => {
        state.metaPersistTimer = null;
        state.metaPersistIdleId = null;
        if (revision && revision === state.metaRevision) {
          storeMetaResponse(data, currentApiUrl(), { validated: true });
        }
      };
      if ('requestIdleCallback' in window) {
        state.metaPersistIdleId = requestIdleCallback(persist, { timeout: 800 });
      } else {
        state.metaPersistTimer = setTimeout(persist, 0);
      }
    }

    function applyMetaResponse(data, { persist = false, cachedAt = 0, validated = false } = {}) {
      if (!data || (!validated && !validMetaOptions(data.options))) {
        throw new ApiError('INVALID_META_RESPONSE', '검색 목록 응답을 확인할 수 없습니다.');
      }
      const revision = metaResponseRevision(data);
      if (!revision || revision.length > 256) {
        throw new ApiError('INVALID_META_RESPONSE', '검색 목록 버전을 확인할 수 없습니다.');
      }
      populateSelect(elements.universityTypeSelect, data.options.universityTypes);
      populateSelect(elements.admissionTypeSelect, data.options.admissionTypes);
      state.textSuggestionCache.clear();
      setUniversityOptions(data.options.universities);
      setTextSuggestionOptions('name', data.options.names);
      setTextSuggestionOptions('admissionName', data.options.admissionNames);
      setTextSuggestionOptions('recruitmentUnit', data.options.recruitmentUnits);
      // University/name search becomes usable first. The larger per-university
      // admission/unit context is built immediately afterward during idle time.
      scheduleUniversityContextOptions(
        data.options.universities,
        data.options.admissionNameIndexesByUniversity,
        data.options.recruitmentUnitIndexesByUniversity
      );
      state.metaRevision = revision;
      state.lastMetaRefreshAt = cachedAt > 0 ? Math.min(cachedAt, Date.now()) : Date.now();
      state.metaRetryAttempts = 0;
      clearTimeout(state.metaRefreshTimer);
      state.metaRefreshTimer = null;
      if (persist) scheduleMetaPersistence(data);
      resumeRecoveredDrafts();
      retryAllDrafts({ immediate: true });
    }

    function restoreStoredMeta() {
      const cached = readStoredMeta();
      if (!cached) return null;
      try {
        applyMetaResponse(
          { options: cached.options, revision: cached.revision },
          { cachedAt: cached.savedAt, validated: true }
        );
        return cached;
      } catch (_) {
        removeStoredMeta();
        return null;
      }
    }

    async function initializeAuthenticatedMeta({ knownRevision = '', serverTime = '' } = {}) {
      const cached = restoreStoredMeta();
      if (!cached) return loadMeta();

      const verifiedRevision = String(knownRevision || '');
      if (verifiedRevision) {
        if (verifiedRevision === cached.revision) {
          setSyncState('online', timeLabel(serverTime));
          return;
        }
        setSyncState('busy', '목록 갱신 중');
        return loadMeta({ force: true });
      }

      setSyncState('busy', '연결 확인 중');
      try {
        const validation = await api('revision');
        const nextRevision = metaResponseRevision(validation);
        if (nextRevision && nextRevision === cached.revision) {
          setSyncState('online', timeLabel(validation.serverTime));
          return;
        }
      } catch (error) {
        if (error.code === 'AUTH_REQUIRED' || error.code === 'UNAUTHORIZED'
          || error.code === 'SESSION_EXPIRED' || error.code === 'CONFIG_REQUIRED') {
          setSyncState('error', '연결 오류');
          return;
        }
      }

      setSyncState('busy', '목록 갱신 중');
      return loadMeta({ force: true });
    }

    function scheduleAuthenticatedMetaInitialization(
      { knownRevision = '', serverTime = '' } = {},
      delayMs = META_BOOTSTRAP_DELAY_MS
    ) {
      // Parsing and indexing the persisted metadata can be expensive on older
      // phones. Keep it outside the password submit task so the dialog and
      // button always finish updating before background initialization starts.
      clearTimeout(state.metaBootstrapTimer);
      state.metaBootstrapTimer = setTimeout(() => {
        state.metaBootstrapTimer = null;
        if (state.searching || state.pendingManualSearch) {
          scheduleAuthenticatedMetaInitialization({ knownRevision, serverTime }, 120);
          return;
        }
        void initializeAuthenticatedMeta({ knownRevision, serverTime });
      }, Math.max(0, Number(delayMs) || 0));
    }

    function scheduleMetaRefresh(revision) {
      const targetRevision = String(revision || '');
      if (!targetRevision || targetRevision === state.metaRevision) return;
      const elapsed = Date.now() - state.lastMetaRefreshAt;
      const delay = Math.max(0, META_REFRESH_MIN_INTERVAL_MS - elapsed);
      clearTimeout(state.metaRefreshTimer);
      state.metaRefreshTimer = setTimeout(() => {
        state.metaRefreshTimer = null;
        loadMeta({ force: true });
      }, delay);
    }

    function loadMeta({ force = false } = {}) {
      if (state.metaPromise) return state.metaPromise;
      const request = (async () => {
        try {
          const data = await api('meta');
          applyMetaResponse(data, { persist: true });
          setSyncState('online', timeLabel(data.serverTime));
        } catch (error) {
          if (error.code !== 'CONFIG_REQUIRED') {
            const mayRetry = error.code !== 'AUTH_REQUIRED' && error.code !== 'SESSION_EXPIRED';
            if (mayRetry) {
              const retryDelay = Math.min(30000, 2000 * (2 ** Math.min(state.metaRetryAttempts, 4)));
              state.metaRetryAttempts += 1;
              clearTimeout(state.metaRefreshTimer);
              state.metaRefreshTimer = setTimeout(() => {
                state.metaRefreshTimer = null;
                loadMeta({ force: true });
              }, retryDelay);
            }
            setSyncState('error', mayRetry ? '연결 재시도' : '연결 오류');
            if (!mayRetry || state.metaRetryAttempts <= 1) toast(error.message, 'error');
          }
        }
      })();
      const wrapped = request.finally(() => {
        if (state.metaPromise === wrapped) state.metaPromise = null;
      });
      state.metaPromise = wrapped;
      return wrapped;
    }

    function populateSelect(select, values) {
      const current = select.value;
      select.replaceChildren(makeOption('', '전체'));
      (values || []).forEach(value => select.append(makeOption(value, value)));
      if ([...select.options].some(option => option.value === current)) select.value = current;
    }

    function makeOption(value, label) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      return option;
    }

    function setupAutocomplete(input, panel, {
      normalizeQuery = normalizeUniversityTerm,
      minimumLength = 2,
      provideSuggestions = universitySuggestions,
      debounceMs = null,
    } = {}) {
      let timer = null;
      let activeIndex = -1;
      let suggestions = [];
      let requestSequence = 0;
      let pendingNavigation = 0;

      function invalidatePending({ preservePanel = false } = {}) {
        requestSequence += 1;
        if (!preservePanel) {
          panel.hidden = true;
          input.setAttribute('aria-expanded', 'false');
          input.removeAttribute('aria-activedescendant');
          activeIndex = -1;
        }
        return requestSequence;
      }

      function close() {
        clearTimeout(timer);
        invalidatePending();
        pendingNavigation = 0;
        suggestions = [];
        panel.replaceChildren();
      }

      function scheduleUpdate(delay, { preservePanel = false } = {}) {
        clearTimeout(timer);
        const sequence = invalidatePending({ preservePanel });
        timer = setTimeout(() => update(sequence), delay);
      }

      async function update(sequence) {
        const query = input.value.trim();
        const normalizedSnapshot = normalizeQuery(query);
        if ([...normalizedSnapshot].length < minimumLength) {
          if (sequence === requestSequence) close();
          return;
        }
        try {
          const nextSuggestions = await provideSuggestions(query);
          if (sequence !== requestSequence || normalizeQuery(input.value.trim()) !== normalizedSnapshot) return;
          if (document.activeElement !== input) { close(); return; }
          suggestions = Array.isArray(nextSuggestions) ? nextSuggestions : [];
          activeIndex = -1;
          input.removeAttribute('aria-activedescendant');
          panel.replaceChildren();
          suggestions.forEach((name, index) => {
            const button = makeElement('button', name, 'suggestion-item');
            button.type = 'button';
            button.tabIndex = -1;
            button.id = `${panel.id}-option-${index}`;
            button.setAttribute('role', 'option');
            button.setAttribute('aria-selected', 'false');
            button.addEventListener('mousedown', event => event.preventDefault());
            button.addEventListener('click', () => { input.value = name; close(); input.focus(); });
            button.addEventListener('pointerenter', () => selectIndex(index, { scroll: false }));
            panel.append(button);
          });
          panel.hidden = suggestions.length === 0;
          input.setAttribute('aria-expanded', String(suggestions.length > 0));
          if (suggestions.length && pendingNavigation) {
            const direction = pendingNavigation;
            pendingNavigation = 0;
            selectIndex(direction < 0 ? suggestions.length - 1 : 0);
          }
        } catch (_) {
          if (sequence === requestSequence && normalizeQuery(input.value.trim()) === normalizedSnapshot) close();
        }
      }

      function selectIndex(index, { scroll = true } = {}) {
        if (!suggestions.length) return;
        activeIndex = Math.max(0, Math.min(index, suggestions.length - 1));
        [...panel.children].forEach((item, idx) => item.setAttribute('aria-selected', String(idx === activeIndex)));
        const active = panel.children[activeIndex];
        if (active) {
          input.setAttribute('aria-activedescendant', active.id);
          if (scroll) active.scrollIntoView({ block: 'nearest' });
        }
      }

      input.addEventListener('input', () => {
        pendingNavigation = 0;
        const defaultDelay = state.universitySearchIndex.length
          ? (EDITION === 'mobile' ? 30 : 25)
          : (EDITION === 'mobile' ? 90 : 140);
        scheduleUpdate(debounceMs == null ? defaultDelay : debounceMs);
      });
      input.addEventListener('compositionstart', () => {
        clearTimeout(timer);
        invalidatePending();
      });
      input.addEventListener('compositionend', () => {
        // The composition input event already rendered the current Korean
        // candidate list. Keep that list visible while the committed value is
        // rechecked so compositionend does not cause a distracting blink.
        scheduleUpdate(0, { preservePanel: true });
      });
      input.addEventListener('focus', () => {
        scheduleUpdate(0);
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (panel.hidden || !suggestions.length) {
            pendingNavigation = 1;
            scheduleUpdate(0, { preservePanel: true });
            return;
          }
          selectIndex(activeIndex >= suggestions.length - 1 ? 0 : activeIndex + 1);
        }
        else if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (panel.hidden || !suggestions.length) {
            pendingNavigation = -1;
            scheduleUpdate(0, { preservePanel: true });
            return;
          }
          selectIndex(activeIndex <= 0 ? suggestions.length - 1 : activeIndex - 1);
        }
        else if (event.key === 'Enter' && activeIndex >= 0) { event.preventDefault(); input.value = suggestions[activeIndex]; close(); }
        else if (event.key === 'Escape') { event.preventDefault(); close(); }
      });
      input.addEventListener('blur', () => setTimeout(() => {
        if (document.activeElement !== input) close();
      }, 120));
    }

    function openSettings() {
      elements.apiUrlInput.value = currentApiUrl();
      if (!elements.settingsDialog.open) elements.settingsDialog.showModal();
    }

    function openPassword() {
      if (DEMO_MODE || !currentApiUrl()) return;
      // Password-manager suggestion UIs live outside this document. A native
      // modal dialog makes everything outside it inert, so the suggestion can
      // be visible yet unclickable. Keep this one dialog non-modal and provide
      // a visual-only shade instead.
      if (elements.passwordDialog.open) return;
      elements.passwordInput.value = '';
      resetPasswordInputFeedback();
      elements.passwordDialog.show();
      elements.passwordDialogShade.hidden = false;
      setTimeout(() => elements.passwordInput.focus(), 30);
    }

    function resetPasswordInputFeedback() {
      elements.passwordInput.placeholder = '비밀번호';
      elements.passwordInput.classList.remove('is-invalid');
      elements.passwordInput.removeAttribute('aria-invalid');
    }

    function showPasswordInputFeedback(message) {
      elements.passwordInput.value = '';
      elements.passwordInput.placeholder = message;
      elements.passwordInput.classList.add('is-invalid');
      elements.passwordInput.setAttribute('aria-invalid', 'true');
      elements.passwordInput.focus();
    }

    async function loginWithPassword() {
      const password = elements.passwordInput.value;
      if (!password) {
        showPasswordInputFeedback('비밀번호를 입력해 주세요.');
        return;
      }
      resetPasswordInputFeedback();
      elements.passwordSubmitButton.disabled = true;
      const submitLabel = elements.passwordSubmitButton.querySelector('span');
      if (submitLabel) submitLabel.textContent = '로그인 중';
      setSyncState('busy', '확인 중');
      try {
        // Keep first-time sign-in fast: authenticate first, then refresh the
        // larger autocomplete index independently in the background.
        const data = await api('login', { password, includeMeta: false }, {
          onRetry: () => {
            if (submitLabel) submitLabel.textContent = '다시 연결 중';
          },
        });
        sessionStorage.setItem('admissionsSession', JSON.stringify({ token: data.sessionToken, expiresAt: data.expiresAt }));
        elements.passwordInput.value = '';
        elements.passwordDialog.close();
        setSyncState('online', '연결됨');
        // Start the read bridge only after authentication. Loading its iframe
        // alongside the direct login POST created avoidable startup contention
        // on mobile Apps Script/WebKit connections.
        setupApiBridge();
        scheduleAuthenticatedMetaInitialization({
          knownRevision: data.sourceRevision || data.revision,
          serverTime: data.serverTime,
        });
      } catch (error) {
        if (error.code === 'INVALID_PASSWORD') {
          setSyncState('idle', '로그인 필요');
          showPasswordInputFeedback('비밀번호를 다시 확인하십시오');
        } else {
          setSyncState('error', '로그인 오류');
          toast(error.message, 'error');
          elements.passwordInput.select();
        }
      } finally {
        elements.passwordSubmitButton.disabled = false;
        if (submitLabel) submitLabel.textContent = '로그인';
      }
    }

    async function saveSettings() {
      const url = elements.apiUrlInput.value.trim();
      let validUrl = false;
      try {
        const parsed = new URL(url);
        validUrl = parsed.protocol === 'https:';
        if (API_TRANSPORT === 'apps-script') {
          validUrl = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(url);
        }
      } catch (_) {
        validUrl = false;
      }
      if (!validUrl) {
        toast('데이터 API URL을 입력해 주세요.', 'error');
        return;
      }
      localStorage.setItem('admissionsApiUrl', url);
      sessionStorage.removeItem('admissionsSession');
      elements.settingsSaveButton.disabled = true;
      const saveLabel = elements.settingsSaveButton.querySelector('span');
      if (saveLabel) saveLabel.textContent = '연결 중';
      try {
        elements.settingsDialog.close();
        setSyncState('idle', '로그인 필요');
        openPassword();
      } catch (error) {
        setSyncState('error', '연결 오류');
        toast(error.message, 'error');
      } finally {
        elements.settingsSaveButton.disabled = false;
        if (saveLabel) saveLabel.textContent = '연결';
      }
    }

    function setSyncState(stateName, label) {
      elements.syncPill.dataset.state = stateName;
      elements.syncText.textContent = label;
    }

    function timeLabel(dateText) {
      const date = dateText ? new Date(dateText) : new Date();
      if (Number.isNaN(date.getTime())) return '동기화됨';
      return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    function toast(message, type = '', duration = 3300) {
      const item = makeElement('div', message, `toast ${type}`.trim());
      elements.toastRegion.append(item);
      setTimeout(() => item.remove(), duration);
    }

    function makeElement(tag, text = '', className = '') {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== '') element.textContent = text;
      return element;
    }

    function makeSvgIcon(markup, className = 'button-icon') {
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('aria-hidden', 'true');
      icon.setAttribute('class', className);
      icon.innerHTML = markup;
      return icon;
    }

    function isStandaloneApp() {
      return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    }

    function updateInstallButton() {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
      elements.installButton.hidden = isStandaloneApp() || (!state.installPrompt && !isIos);
    }

    async function installApp() {
      if (state.installPrompt) {
        const promptEvent = state.installPrompt;
        state.installPrompt = null;
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice.outcome === 'accepted') toast('앱 설치를 시작했습니다.', 'success');
        updateInstallButton();
        return;
      }
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        toast('Safari 공유 버튼에서 홈 화면에 추가를 선택하세요.', 'success', 5000);
      }
    }

    function setupInstall() {
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        state.installPrompt = event;
        updateInstallButton();
      });
      window.addEventListener('appinstalled', () => {
        state.installPrompt = null;
        updateInstallButton();
      });
      elements.installButton.addEventListener('click', installApp);
      updateInstallButton();
      if (!DEMO_MODE && location.protocol === 'https:' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    function configureSortControls() {
      COLUMNS.forEach(column => elements.mobileSortSelect.append(makeOption(column.key, column.label)));
      syncSortControls();
    }

    function wireEvents() {
      elements.searchForm.addEventListener('submit', event => {
        event.preventDefault();
        performSearch({ silent: false, manual: true });
      });
      elements.mobileSearchButton.addEventListener('click', () => performSearch({ silent: false, manual: true }));
      elements.mobileSearchSummary.addEventListener('click', () => {
        setMobileSearchExpanded(!document.body.classList.contains('mobile-search-expanded'));
      });
      elements.detailToggle.addEventListener('click', () => toggleDetails());
      elements.mobileDetailButton.addEventListener('click', () => toggleDetails());
      elements.clearButton.addEventListener('click', resetSearch);
      $('reviewOnly').addEventListener('change',()=>performSearch({silent:false,manual:true}));
      elements.scheduleGrid.addEventListener('click', event => {
        const button = event.target.closest('[data-schedule-category]');
        if (button) openScheduleDialog(button.dataset.scheduleCategory, button);
      });
      elements.mobileScheduleOpenButton.addEventListener('click', () => {
        openAllSchedulesDialog(elements.mobileScheduleOpenButton);
      });
      elements.scheduleDialogCloseButton.addEventListener('click', closeScheduleDialog);
      elements.scheduleDialogDoneButton.addEventListener('click', closeScheduleDialog);
      elements.scheduleDialog.addEventListener('close', () => {
        if (state.scheduleDialogTrigger?.isConnected) state.scheduleDialogTrigger.focus();
        state.scheduleDialogTrigger = null;
      });
      elements.moreButton.addEventListener('click', () => {
        state.visibleCount += MORE_PAGE_SIZE;
        renderResults();
      });
      elements.expandAllButton.addEventListener('click', () => {
        state.visibleCount = state.records.length;
        renderResults();
      });
      elements.collapseButton.addEventListener('click', () => {
        state.visibleCount = INITIAL_PAGE_SIZE;
        renderResults();
        $('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      const scrollToPageTop = () => {
        elements.tableWrap.scrollTo({ top: 0, behavior: 'smooth' });
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // 긴 모바일 목록에서도 브라우저의 smooth-scroll 거리에 따라 중간에서
        // 멈추지 않도록 애니메이션 뒤 최상단 위치를 한 번 확정합니다.
        setTimeout(() => {
          elements.tableWrap.scrollTop = 0;
          if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
          window.scrollTo(0, 0);
        }, 520);
      };
      elements.scrollTopButton.addEventListener('click', scrollToPageTop);
      elements.mobileScrollTopButton.addEventListener('click', scrollToPageTop);
      let topFabFrame = 0;
      const updateMobileTopFab = () => {
        topFabFrame = 0;
        const visible = EDITION === 'mobile' && window.scrollY > 320;
        elements.mobileScrollTopButton.classList.toggle('is-visible', visible);
        elements.mobileScrollTopButton.setAttribute('aria-hidden', String(!visible));
        elements.mobileScrollTopButton.tabIndex = visible ? 0 : -1;
      };
      window.addEventListener('scroll', () => {
        if (!topFabFrame) topFabFrame = requestAnimationFrame(updateMobileTopFab);
      }, { passive: true });
      updateMobileTopFab();
      if (EDITION === 'pc') elements.exportButton.addEventListener('click', exportCurrentResults);
      else elements.exportButton.hidden = true;
      elements.mobileSortSelect.addEventListener('change', () => { state.sortKey = elements.mobileSortSelect.value; renderResults(); });
      elements.mobileSortDirection.addEventListener('click', () => {
        state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
        syncSortControls();
        renderResults();
      });
      elements.settingsButton.addEventListener('click', openSettings);
      elements.settingsCloseButton.addEventListener('click', () => elements.settingsDialog.close());
      elements.settingsCancelButton.addEventListener('click', () => elements.settingsDialog.close());
      elements.settingsForm.addEventListener('submit', event => { event.preventDefault(); saveSettings(); });
      elements.passwordForm.addEventListener('submit', event => { event.preventDefault(); loginWithPassword(); });
      elements.passwordInput.addEventListener('input', resetPasswordInputFeedback);
      elements.passwordDialog.addEventListener('cancel', event => event.preventDefault());
      elements.passwordDialog.addEventListener('close', () => {
        elements.passwordDialogShade.hidden = true;
      });
      elements.conflictKeepServerButton.addEventListener('click', keepServerConflictValue);
      elements.conflictApplyMineButton.addEventListener('click', applyLocalConflictValue);
      elements.conflictDialog.addEventListener('cancel', event => event.preventDefault());
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          persistPendingDrafts();
          return;
        }
        resumeRecoveredDrafts();
        retryAllDrafts({ immediate: true });
        if (state.lastFilters) pollForChanges();
      });
      window.addEventListener('online', () => {
        resumeRecoveredDrafts();
        retryAllDrafts({ immediate: true });
      });
      window.addEventListener('pagehide', persistPendingDrafts);
      window.addEventListener('beforeunload', persistPendingDrafts);
    }

    function demoApi(action, payload) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (!window.__demoRows) window.__demoRows = demoRows();
          if (!window.__demoRevision) window.__demoRevision = 'demo-0';
          if (!window.__demoSourceRevision) window.__demoSourceRevision = 'demo-source-0';
          if (action === 'health') resolve({ ok: true, serverTime: new Date().toISOString() });
          else if (action === 'revision') resolve({ ok: true, revision: window.__demoRevision, sourceRevision: window.__demoSourceRevision, serverTime: new Date().toISOString() });
          else if (action === 'meta') resolve({
            ok: true,
            options: {
              universityTypes: ['일반대학'], enrollments: ['재학생', '졸업생'], classes: ['1', '2', '3'],
              tracks: ['인문', '자연'], admissionTypes: ['교과(학생부)', '교과(면접)', '종합', '논술'],
              universities: ['샘플대학교', '샘플대학교(제2캠퍼스)', '예시대학교', '테스트대학교'],
              names: ['샘플학생가', '샘플학생나', '샘플학생다'],
              admissionNames: ['샘플종합전형', '샘플교과전형', '샘플논술전형'],
              recruitmentUnits: ['샘플학과A', '샘플학과B', '샘플학과C'],
              admissionNameIndexesByUniversity: [[0], [0], [1], [2]],
              recruitmentUnitIndexesByUniversity: [[0], [0], [1], [2]],
            },
            revision: window.__demoRevision,
            sourceRevision: window.__demoSourceRevision,
            serverTime: new Date().toISOString(),
          });
          else if (action === 'universities') {
            window.__demoUniversitySuggestionRequests = Number(window.__demoUniversitySuggestionRequests || 0) + 1;
            const query = normalizeUniversityTerm(payload.query);
            resolve({
              ok: true,
              suggestions: ['샘플대학교', '샘플대학교(제2캠퍼스)', '예시대학교', '테스트대학교']
                .filter(value => normalizeUniversityTerm(value).includes(query)),
              serverTime: new Date().toISOString(),
            });
          }
          else if (action === 'sync' && !payload.force
              && String(payload.knownRevision || '') === String(window.__demoRevision)) {
            resolve({
              ok: true,
              notModified: true,
              revision: window.__demoRevision,
              sourceRevision: window.__demoSourceRevision,
              serverTime: new Date().toISOString(),
            });
          }
          else if (action === 'search' || action === 'sync') {
            window.__demoSearchRequests = Number(window.__demoSearchRequests || 0) + 1;
            if (!Array.isArray(window.__demoSearchPayloads)) window.__demoSearchPayloads = [];
            window.__demoSearchPayloads.push(JSON.parse(JSON.stringify(payload || {})));
            if (Number(window.__demoSearchFailures) > 0) {
              window.__demoSearchFailures = Number(window.__demoSearchFailures) - 1;
              window.__demoSearchFailureEvents = Number(window.__demoSearchFailureEvents || 0) + 1;
              reject(new ApiError('DEMO_SEARCH_FAILED', '데모 검색 실패'));
              return;
            }
            resolve({ ok: true, notModified: false, records: existingFilter(window.__demoRows, payload.filters).map(record => ({ ...record })), totalMatches: existingFilter(window.__demoRows, payload.filters).length, truncated: false, revision: window.__demoRevision, sourceRevision: window.__demoSourceRevision, serverTime: new Date().toISOString() });
          }
          else if (action === 'export') resolve({
            ok: true,
            headers: ['대학구분', '재학여부', '재학년도', '반', '번호', '성명', '대학명', '모집시기', '전형유형', '선발유형', '계열', '전형명', '모집단위', '(원본)평가단위명', '생년월일', '수험번호', '1단계 합격', '최종 합격', '불합격 사유', '충원예측 입력', '최초 충원번호', '최종 충원번호'],
            rows: window.__demoRows.map(record => [
              record.universityType, record.enrollment, ADMISSION_YEAR, record.classNo,
              String(record.studentNo || '').padStart(2, '0'), record.name, record.university, '수시',
              record.admissionType, record.selectionType, record.track, record.admissionName,
              record.recruitmentUnit, '', record.birthdate, record.examNo, record.stage1, record.finalResult,
              record.failureReason, record.waitPrediction, record.firstWait, record.finalWait,
            ]),
            totalMatches: window.__demoRows.length,
            serverTime: new Date().toISOString(),
          });
          else if (action === 'save') {
            const row = window.__demoRows.find(item => item.id === payload.recordId);
            if (Number(window.__demoSaveFailures) > 0) {
              window.__demoSaveFailures = Number(window.__demoSaveFailures) - 1;
              window.__demoSaveFailureEvents = Number(window.__demoSaveFailureEvents || 0) + 1;
              const failure = window.__demoSaveFailure || {};
              const code = String(failure.code || 'DEMO_SAVE_FAILED');
              const details = code === 'FIELD_CONFLICT'
                ? { current: { ...row }, conflictingFields: failure.conflictingFields || [] }
                : failure.details;
              reject(new ApiError(code, failure.message || '데모 저장 실패', details));
              return;
            }
            Object.assign(row, payload.values, { version: String(Date.now()) });
            if (isStepwiseSelection(row) && row.stage1 === '불합격') {
              row.finalResult = '불합격';
              row.failureReason = '1단계 불합격';
            }
            window.__demoRevision = `demo-${Date.now()}`;
            resolve({ ok: true, record: { ...row }, revision: window.__demoRevision, sourceRevision: window.__demoSourceRevision, serverTime: new Date().toISOString() });
          }
        }, Number(window.__demoApiDelayMs) || 260);
      });
    }

    function demoRows() {
      return [
        { id:'demo-1',version:'1',rowNumber:2,universityType:'일반대학',enrollment:'재학생',classNo:'3',studentNo:'12',name:'샘플학생가',university:'샘플대학교',track:'자연',admissionType:'종합',admissionName:'샘플종합전형',recruitmentUnit:'샘플학과A',birthdate:'090101',examNo:'SAMPLE-001',selectionType:'단계별전형',stage1Locked:false,stage1:'합격',finalResult:'',failureReason:'',waitPrediction:false,firstWait:'',finalWait:'' },
        { id:'demo-2',version:'1',rowNumber:3,universityType:'일반대학',enrollment:'재학생',classNo:'2',studentNo:'7',name:'샘플학생나',university:'예시대학교',track:'인문',admissionType:'교과(학생부)',admissionName:'샘플교과전형',recruitmentUnit:'샘플학과B',birthdate:'090202',examNo:'SAMPLE-002',selectionType:'일괄합산',stage1Locked:true,stage1:'일괄합산',finalResult:'합격',failureReason:'',waitPrediction:false,firstWait:'',finalWait:'' },
        { id:'demo-3',version:'1',rowNumber:4,universityType:'일반대학',enrollment:'졸업생',classNo:'1',studentNo:'3',name:'샘플학생다',university:'테스트대학교',track:'자연',admissionType:'논술',admissionName:'샘플논술전형',recruitmentUnit:'샘플학과C',birthdate:'080303',examNo:'SAMPLE-003',selectionType:'일괄합산',stage1Locked:true,stage1:'일괄합산',finalResult:'',failureReason:'',waitPrediction:false,firstWait:'12',finalWait:'5' },
      ];
    }

    function init() {
      // Draft recovery is disabled to avoid carrying edits between accounts.
      if (DEMO_MODE) document.querySelectorAll('.edition-switch').forEach(link => { link.href=EDITION==='pc'?'../모바일%20버전/index.html?demo=1':'../PC%20버전/index.html?demo=1'; });
      configureSortControls();
      renderTodaySchedule();
      wireEvents();
      if(elements.installButton) elements.installButton.hidden=true;
      if ('ResizeObserver' in window) {
        state.searchPanelObserver = new ResizeObserver(updateStickySearchMetrics);
        state.searchPanelObserver.observe(elements.searchPanel);
      }
      window.addEventListener('resize', updateStickySearchMetrics, { passive: true });
      setupAutocomplete(elements.universityInput, $('universitySuggestions'));
      setupAutocomplete(elements.nameInput, $('nameSuggestions'), {
        minimumLength: 1,
        debounceMs: 35,
        provideSuggestions: query => textSuggestions('name', query),
      });
      setupAutocomplete(elements.admissionInput, $('admissionSuggestions'), {
        debounceMs: 35,
        provideSuggestions: query => textSuggestions('admissionName', query),
      });
      setupAutocomplete(elements.recruitmentUnitInput, $('recruitmentUnitSuggestions'), {
        debounceMs: 35,
        provideSuggestions: query => textSuggestions('recruitmentUnit', query),
      });
      renderResults(0, false);
      if (DEMO_MODE) {
        setSyncState('online', '데모');
        loadMeta();
      } else if (currentApiUrl() && currentSessionToken()) {
        setupApiBridge();
        scheduleAuthenticatedMetaInitialization();
      } else if (currentApiUrl()) {
        setSyncState('idle', '로그인 필요');
        openPassword();
      } else {
        setSyncState('idle', '연결 필요');
        openSettings();
      }
    }

    if (!DEMO_MODE) {
      existingRequest('me').then(user => {
        existingUser = user;
        sessionStorage.setItem('admissionsSession', JSON.stringify({token:'existing-cookie-session',expiresAt:Date.now()+14400000}));
        init();
      }).catch(() => { sessionStorage.removeItem('admissionsSession'); init(); });
    } else init();
  </script>

<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ieum-admissions-2027-kkw.bboykw.chatgpt.site; base-uri 'none'; form-action 'none'">
<title>2027 수시진학관리</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;background:#f2f6fc;color:#14233e}main{max-width:1000px;margin:auto;padding:3rem 1rem}section,form{background:white;padding:1.5rem;border:1px solid #d6e2f2;border-radius:16px}form{max-width:460px}label{display:block;margin-bottom:.5rem}input,button,select{font:inherit;border:1px solid #8294af;border-radius:8px;padding:.6rem .8rem}button{background:#174ea6;color:white;cursor:pointer}button:disabled{opacity:.6}input{max-width:100%}p[role=status]{min-height:1.5em}#results>div{overflow:auto}table{width:100%;border-collapse:collapse;min-width:630px}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #d6e2f2}th{background:#edf4ff}tbody tr:nth-child(even){background:#f8fbff}.pass{color:#14643f;font-weight:700}.fail{color:#9c2e36}.reserve{color:#754700}
th button{background:transparent;color:inherit;border:0;padding:.15rem 0;text-align:left;white-space:nowrap;font-weight:700}th button:hover{text-decoration:underline}td:first-child,td:nth-last-child(-n+2){white-space:nowrap}td:nth-last-child(-n+2){min-width:4.5rem}
.result-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:1rem}.stats{display:flex;flex-wrap:wrap;gap:.5rem;margin:0}.stats div{background:#edf4ff;border-radius:8px;padding:.55rem .75rem}.stats dt{font-size:.8rem}.stats dd{margin:.15rem 0 0;font-size:1.25rem;font-weight:700}.summary-note{color:#435674;font-size:.85rem}.single-round{color:#435674;font-size:.8rem}
</style>
<main>
<header><p>교사용 조회</p><h1>2027 수시진학관리</h1></header>
<form id="login">
<h2>전체 대학 합불 조회</h2>
<label for="password">접속 비밀번호</label>
<input id="password" type="password" inputmode="numeric" required autocomplete="current-password">
<button id="unlock">결과 보기</button>
</form>
<p id="status" role="status"></p>
<section id="results" hidden>
<div class="result-top">
<h2>전체 대학 지원 결과</h2>
<dl class="stats" aria-label="조회 결과 요약">
<div><dt>지원 인원</dt><dd id="applicants">–</dd></div>
<div><dt>1차 합격 인원</dt><dd id="first-pass">–</dd></div>
<div><dt>최종 합격 인원</dt><dd id="final-pass">–</dd></div>
</dl>
</div>
<p class="summary-note">현재 선택한 대학 기준입니다. 인원은 항목별로 학생당 한 번만 셉니다. 최종 합격에는 충원합격을 포함합니다.</p>
<p id="selection-note" class="summary-note"></p>
<label for="university">대학</label>
<select id="university"><option value="">전체 대학</option></select>
<p id="count" aria-live="polite"></p>
<button id="lock" type="button">조회 종료</button>
<p id="sort-status" aria-live="polite"></p>
<button id="reset-sort" type="button">기본 정렬</button>
<div><table><thead><tr><th scope="col"><button type="button" data-sort="name">학생 <span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" data-sort="university">대학 <span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" data-sort="track">전형 <span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" data-sort="department">모집단위 <span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" data-sort="first_stage">1차 <span aria-hidden="true">↕</span></button></th><th scope="col"><button type="button" data-sort="final_stage">최종 <span aria-hidden="true">↕</span></button></th></tr></thead><tbody id="rows"></tbody></table></div>
<p><button id="previous" type="button">이전</button> <span id="page"></span> <button id="next" type="button">다음</button></p>
</section>
</main>
<script>
const api = 'https://ieum-admissions-2027-kkw.bboykw.chatgpt.site/api/';
const get = id => document.getElementById(id);
async function request(path, options) {
  const reply = await fetch(api + path, { ...options, credentials: 'omit', cache: 'no-store', redirect: 'error' });
  const body = await reply.json();
  if (!reply.ok) throw new Error(body.error || '조회할 수 없습니다.');
  return body;
}
const schoolAliases = new Map([
  ['서정대학', '서정대학교'],
  ['영진전문대학', '영진전문대학교'],
  ['목포대학교', '국립목포대학교'],
  ['순천대학교', '국립순천대학교']
]);
const campusAliases = new Map([
  ['건국대학교글로컬캠퍼스', ['건국대학교', '글로컬']],
  ['동국대학교경주캠퍼스', ['동국대학교', 'WISE']],
  ['한양대학교ERICA캠퍼스', ['한양대학교', 'ERICA']]
]);
function schoolInfo(value) {
  const original = (value || '').normalize('NFKC').trim();
  const compact = original.replace(/\s+/g, '');
  const explicit = campusAliases.get(compact);
  const region = original.match(/^(.+?)\s*\(([^)]+)\)(.*)$/);
  const campusName = original.match(/^(.+?대학교)\s+(.+?)캠퍼스$/);
  const [rawName, campus = ''] = explicit || (region
    ? [region[1], (region[2] + region[3]).trim()]
    : campusName ? [campusName[1], campusName[2]] : [original]);
  const name = schoolAliases.get(rawName) || rawName;
  const label = name === '한성대학교' && campus === '서울' ? name :
    campus ? name + ' (' + campus + ')' : name;
  return { name, label };
}

const hansungTracks = new Map([
  ['학생부종합(한성인재전형)', '한성인재'], ['한성인재ㅐ', '한성인재'],
  ['학생부종합(고른기회전형)', '고른기회'],
  ['실기(실기우수자전형)', '실기우수자'],
  ['학생부교과(지역균형-수능 최저학력기준 미적용)', '지역균형'],
  ['학생부교과(교과우수-수능 최저학력기준 적용)', '교과우수']
]);
function prepareRows(rows) {
  const prepared = [];
  const hansung = new Map();
  for (const source of rows) {
    const row = { ...source, school: schoolInfo(source.university) };
    if (row.school.name !== '한성대학교') {
      prepared.push(row);
      continue;
    }
    row.track = hansungTracks.get(source.track) || source.track;
    if (row.student_key == null || !row.track || !row.department) {
      prepared.push(row);
      continue;
    }
    const key = JSON.stringify([row.student_key, row.track, row.department.replace(/\s+/g, '')]);
    if (!hansung.has(key)) hansung.set(key, []);
    hansung.get(key).push({ row, sourceTrack: source.track });
  }
  const fields = ['first_stage', 'final_stage', 'waitlist', 'selection'];
  for (const items of hansung.values()) {
    const [a, b] = items;
    if (items.length !== 2 || a.sourceTrack === b.sourceTrack ||
      fields.some(field => a.row[field] && b.row[field] && a.row[field] !== b.row[field])) {
      prepared.push(...items.map(item => item.row));
      continue;
    }
    const merged = { ...(a.row.final_stage ? a.row : b.row) };
    for (const field of fields) merged[field] = a.row[field] || b.row[field];
    prepared.push(merged);
  }
  return prepared;
}

const collator = new Intl.Collator('ko', { numeric: true });
const sortButtons = [...document.querySelectorAll('[data-sort]')];
const defaultSort = [{ key: 'track', direction: 1 }, { key: 'name', direction: 1 }];
let sortOrder = defaultSort;
function sortValue(row, key) {
  return (key === 'university' ? row.school.label : key === 'first_stage' && isSingleRound(row) ? '일괄합산' : row[key])?.trim() || '';
}
function sortRows(rows, order) {
  return [...rows].sort((left, right) => {
    for (const { key, direction } of order) {
      const a = sortValue(left, key);
      const b = sortValue(right, key);
      if (!a || !b) {
        if (a !== b) return a ? -1 : 1;
        continue;
      }
      const comparison = collator.compare(a, b);
      if (comparison) return comparison * direction;
      if (key === 'final_stage' && a === '예비') {
        const rank = row => Number.parseInt(row.waitlist, 10) || Infinity;
        if (rank(left) !== rank(right)) return rank(left) < rank(right) ? -direction : direction;
      }
    }
    return 0;
  });
}
let allRows = [];
let filteredRows = [];
let page = 0;
const pageSize = 100;
function selectUniversity() {
  const select = get('university');
  select.replaceChildren(new Option('전체 대학', ''));
  const names = [...new Set(allRows.map(row => row.school.name).filter(Boolean))];
  names.sort((a, b) => a.localeCompare(b, 'ko'));
  for (const name of names) select.add(new Option(name, name));
}
get('university').addEventListener('change', event => {
  const name = event.target.value;
  showRows(name ? allRows.filter(row => row.school.name === name) : allRows);
});
function showRows(rows) {
  filteredRows = sortRows(rows, sortOrder);
  renderSummary(filteredRows);
  page = 0;
  render();
}
get('previous').addEventListener('click', () => { page--; render(); });
get('next').addEventListener('click', () => { page++; render(); });
function updateSort() {
  for (const button of sortButtons) {
    const direction = sortOrder.find(item => item.key === button.dataset.sort)?.direction;
    button.querySelector('span').textContent = direction === 1 ? '↑' : direction === -1 ? '↓' : '↕';
    button.parentElement.removeAttribute('aria-sort');
    if (button.dataset.sort === sortOrder[0].key) {
      button.parentElement.setAttribute('aria-sort', direction === 1 ? 'ascending' : 'descending');
    }
  }
  const primary = sortButtons.find(button => button.dataset.sort === sortOrder[0].key);
  get('sort-status').textContent = sortOrder === defaultSort ? '전형 오름차순 → 학생 이름 오름차순' :
    primary.firstChild.textContent.trim() + (sortOrder[0].direction === 1 ? ' 오름차순' : ' 내림차순');
  showRows(filteredRows);
}
for (const button of sortButtons) {
  button.addEventListener('click', () => {
    const key = button.dataset.sort;
    const direction = sortOrder[0].key === key ? -sortOrder[0].direction : 1;
    sortOrder = [{ key, direction }, ...defaultSort.filter(item => item.key !== key)];
    updateSort();
  });
}
get('reset-sort').addEventListener('click', () => {
  sortOrder = defaultSort;
  updateSort();
});
function isSingleRound(row) {
  return row.selection === '일괄합산';
}
function renderSummary(rows) {
  const people = records => new Set(records.map(row => row.student_key)).size;
  const accepted = status => status === '합격' || status === '충원합격';
  const format = number => number.toLocaleString('ko-KR');
  const count = records => records.every(row => row.student_key != null) ? format(people(records)) + '명' : '–';
  get('applicants').textContent = count(rows);
  get('first-pass').textContent = count(rows.filter(row => !isSingleRound(row) && accepted(row.first_stage)));
  get('final-pass').textContent = count(rows.filter(row => accepted(row.final_stage)));
  const unknown = rows.filter(row => !row.selection).length;
  const conflicts = rows.filter(row => isSingleRound(row) && row.first_stage && row.first_stage !== '해당없음').length;
  get('selection-note').textContent = [
    unknown ? '선발 방식 미확인 ' + format(unknown) + '건' : '',
    conflicts ? '일괄합산으로 분류됐으나 1차 기록이 있는 ' + format(conflicts) + '건은 확인이 필요합니다.' : ''
  ].filter(Boolean).join(' · ');
}
function render() {
  const pages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
  get('page').textContent = (page + 1) + ' / ' + pages;
  get('previous').disabled = page === 0;
  get('next').disabled = page + 1 >= pages;
  get('rows').replaceChildren();
  for (const item of filteredRows.slice(page * pageSize, (page + 1) * pageSize)) {
    const row = get('rows').insertRow();
    const first = isSingleRound(item) ? '일괄합산' : item.first_stage;
    for (const value of [item.name, item.school.label, item.track, item.department, first, item.final_stage]) {
      const cell = row.insertCell();
      cell.textContent = value || '미입력';
      if (row.cells.length === 5 && isSingleRound(item)) {
        cell.className = 'single-round';
        if (item.first_stage && item.first_stage !== '해당없음') {
          cell.textContent += ' · 확인 필요';
          cell.title = '기록된 1차 결과: ' + item.first_stage;
        }
      }
      if (['합격', '충원합격'].includes(value)) cell.className = 'pass';
      if (value === '불합격') cell.className = 'fail';
      if (value === '예비') {
        cell.className = 'reserve';
        if (row.cells.length === 6 && item.waitlist) cell.textContent += ' ' + item.waitlist + '번';
      }
    }
  }
  get('count').textContent = filteredRows.length + '건 · 지원 건 기준';
}
get('login').addEventListener('submit', async event => {
  event.preventDefault();
  get('unlock').disabled = true;
  get('status').textContent = '결과를 불러오는 중입니다.';
  const password = get('password').value;
  get('password').value = '';
  try {
    const { session } = await request('pages-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password })
    });
    const { rows } = await request('pages-data', { headers: { Authorization: 'Bearer ' + session } });
    allRows = prepareRows(rows);
    selectUniversity();
    sortOrder = defaultSort;
    showRows(allRows);
    updateSort();
    get('login').hidden = true;
    get('results').hidden = false;
    get('lock').focus();
    get('status').textContent = '';
  } catch (error) {
    get('status').textContent = error instanceof TypeError ? '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.' : error.message;
    get('password').focus();
  } finally {
    get('unlock').disabled = false;
  }
});
get('lock').addEventListener('click', () => {
  allRows = [];
  selectUniversity();
  showRows(allRows);
  get('results').hidden = true;
  get('login').hidden = false;
  get('password').focus();
});
addEventListener('pagehide', () => get('lock').click());
</script>
</html>
